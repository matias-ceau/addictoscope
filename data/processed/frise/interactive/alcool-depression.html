<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mute:#6b6b66;--line:#d8d8d0;--panel:#fff;--axis:#1d1d1b}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1200px;margin:0 auto;padding:12px 16px 32px}
h1{font-size:18px;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 10px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
button,.chip{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chip[aria-pressed=false]{opacity:.4}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:pan-y}
svg{display:block;width:100%}
text{fill:var(--fg);font-size:12px}
.mute{fill:var(--mute)}
.ev{cursor:pointer}
.ev:hover rect,.ev.sel rect,.ev:hover path,.ev.sel path{stroke:var(--fg);stroke-width:1.6}
#detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:10px;min-height:76px}
#detail b{font-size:15px}
.obs{border:1px solid var(--line);border-radius:8px;margin-top:6px;overflow:hidden}
.oh{background:var(--bg);color:var(--mute);font-size:12px;padding:4px 10px;border-bottom:1px solid var(--line)}
.ot{white-space:pre-wrap;padding:8px 10px;max-height:240px;overflow:auto;font-size:13px}
mark{background:#fde047;color:#1d1d1b;border-radius:3px;padding:0 1px}
@media (prefers-color-scheme:dark){mark{background:#a16207;color:#fff}}
#detail .k{color:var(--mute);font-size:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:12px;margin-top:8px}
.sw{display:inline-block;width:22px;height:9px;border-radius:2px;vertical-align:middle;margin-right:4px}
#undated{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-top:10px}
#undated h2{font-size:14px;margin:2px 0 4px}
#undated ul{margin:4px 0 2px;padding-left:18px}
#undated li{margin:3px 0}
#undated .k{color:var(--mute);font-size:12px}
</style>

sion non versée par l'ex-mari depuis l'été 2022, découvert bancaire important.", "sources": ["historique 2023-01-03"], "evidence": [{"id": "historique:o9", "marks": [[237, 296]]}], "s": "2022-01-01", "e": null, "point": false, "startLabel": "2022", "endLabel": null}, {"track": "t27", "start": "2023-04", "end": null, "ongoing": false, "mode": null, "loss": false, "certainty": null, "ageNote": null, "note": "Décès fin avril 2023, \"il y a une dizaine de jours\" le 10/05. Mère atteinte d'un cancer du pancréas et hospitalisée. Aggravation thymique et envie de boire.", "sources": ["historique 2022-11-24", "historique 2023-05-10", "historique 2023-06-13"], "evidence": [{"id": "historique:o3", "marks": [[1076, 1116], [1257, 1312]]}, {"id": "historique:o13", "marks": [[0, 78]]}, {"id": "historique:o14", "marks": [[15, 73]]}], "s": "2023-04-01", "e": null, "point": true, "startLabel": "2023-04", "endLabel": null}, {"track": "t28", "start": "2023-09-04", "end": null, "ongoing": true, "mode": null, "loss": false, "certainty": null, "ageNote": null, "note": "À l'EHPAD.", "sources": ["historique 2023-09-19"], "evidence": [{"id": "historique:o16", "marks": [[73, 189]]}], "s": "2023-09-04", "e": null, "point": false, "startLabel": "2023-09-04", "endLabel": null}, {"track": "t29", "start": "2024-01", "end": null, "ongoing": false, "mode": null, "loss": false, "certainty": null, "ageNote": null, "note": "Début janvier 2024, maison vide, déclencheur de la reprise des consommations.", "sources": ["historique 2024-01-23"], "evidence": [{"id": "historique:o17", "marks": [[116, 221]]}], "s": "2024-01-01", "e": null, "point": true, "startLabel": "2024-01", "endLabel": null}], "undated": [], "obs": {"courrier:o1": {"label": "courrier · compte rendu d'hospitalisation (courrier)", "date": "2022-12-19", "text": "CENTRE HOSPITALIER FICTIF DU BOIS-JOLI\nPôle d'addictologie - Unité de sevrage\n\n*Chef de pôle\nDr [identité] [identité]\n*Praticiens hospitaliers\nDr [identité] [identité]\nDr [identité] [identité]\nDr [identité] [identité]\n*Psychologue\nMme [identité] [identité]\n*Cadre de santé\nMme [identité] [identité]\n*Secrétariat\nTél. 05 00 12 34 56\n\nBordeaux, le 19/12/2022\n\nDr [identité] [identité]\n[identité]\n33140 VILLENAVE-D'ORNON\n\n*Objet : compte rendu d'hospitalisation\nPatiente : Mme [identité] [identité], née [identité] le [identité]\nHospitalisée du 05/12/2022 au 16/12/2023 dans l'unité de sevrage.\n\nCher Confrère,\n\nVotre patiente, Mme [identité], âgée de 50 ans, a été hospitalisée pour un sevrage d'alcool programmé, après un passage aux urgences le 14/11/2022 (alcoolisation aiguë, chute, fracture du radius gauche).\n\nAntécédents : trouble de l'usage de l'alcool depuis 2015 environ, sevrage hospitalier en 2019 ; intoxication médicamenteuse volontaire en 2016 ; tabagisme à 10 cigarettes par jour.\n\nÉvolution : sevrage par diazépam selon protocole, compliqué à J2 d'hallucinations visuelles transitoires sans délirium tremens. GGT 287, VGM 103, stéatose hépatique à l'échographie. Sur le plan thymique, persistance d'éléments dépressifs, à réévaluer en ambulatoire.\n\nTraitement de sortie : acamprosate 333 mg 2-2-2, thiamine 250 mg/j.\n\nSuivi : CSAPA du centre hospitalier (Dr [identité], Mme [identité] psychologue).\n\nJe vous prie de croire, Cher Confrère, à l'expression de mes sentiments confraternels.\n\nDr [identité] [identité]"}, "historique:o1": {"label": "historique · Observation médicale des urgences", "date": "2022-11-14", "text": "Observations :\nPatiente de 50 ans amenée par les pompiers pour chute à domicile dans un contexte d'alcoolisation aiguë. Appel de son fils [identité] (19 ans) qui l'a retrouvée au sol dans la cuisine vers 21h.\nATCD : OH chronique, \"sevrage en clinique il y a 3 ans\" selon le fils. Syndrome dépressif non traité ? Tabac 10 cig/j. Pas de ttt habituel.\nAlcoolémie 2,84 g/L à 22h15. GCS 14. Hématome frontal G, pas de PC rapportée. Douleur + déformation poignet G.\nRadio : fracture extrémité inf. du radius G non déplacée. TDM cérébrale : pas de saignement.\nConclusions :\nIEA avec chute. Fracture radius G : immobilisation plâtrée, avis ortho demain. Surveillance UHCD jusqu'à dégrisement. Proposition de rencontre avec l'ELSA, patiente d'accord \"si ça peut aider\"."}, "historique:o2": {"label": "historique · Observation ELSA", "date": "2022-11-15", "text": "Rencontre de Mme [identité] à l'UHCD à la demande des urgences. Pateinte calme, un peu honteuse, dit \"je bois pour dormir depuis le divorce\".\nConsos : vin rosé, 1,5 à 2 bouteilles/jour, plus le week end. Premiere conso le matin vers 10h, tremblements matinaux +. Pas de crise convulsive ni de DT connus.\nTabac : dit etre non fumeuse.\nSevrage antérieur : clinique des Pins en 2019, \"tenu 4 mois\".\nVit seule depuis le départ de sa fille [identité] pour ses études, son fils [identité] passe \"un week end sur deux\". En arret de travail (AS en EHPAD) depuis septembre.\nCushman 2 ce matin (6 à 8h selon les collegues de nuit).\nAccepte une hospitalisation pour sevrage programmé. Tel pour la recontacter : [identité].\nConclusions :\nInscription sur liste d'attente sevrage. RDV consult addicto avec le Dr [identité] le 24/11."}, "historique:o3": {"label": "historique · Consultation psychiatrique addictologie", "date": "2022-11-24", "text": "Observations :\nPremière consultation. Adressée par l'ELSA après passage aux urgences le 14/11 (IEA, chute, fracture du radius G).\nHistoire des consommations : premières ivresses à l'adolescence, usage festif jusqu'à la trentaine. Usage quotidien installé vers 2015, aggravé après le divorce (2016). Un sevrage hospitalier en 2019 (clinique des Pins), abstinence de 4 mois, puis reprise progressive.\nActuellement 10 à 12 UIA/j, consommation matinale, perte de contrôle, abandon des activités. Trouble de l'usage de l'alcool sévère (8 critères DSM-5).\nTabac 10 cig/j. Pas d'autre produit, pas de BZD hors prescription.\nThymie : tristesse, anhédonie partielle, sommeil fragmenté avec réveils précoces, culpabilité vis-à-vis des enfants. Pas d'idées suicidaires actuelles. Un passage à l'acte en 2016 (IMV, non hospitalisée) au moment de la séparation. Évaluation thymique à refaire à distance du sevrage.\nContexte : divorcée, 2 enfants ([identité] 23 ans, [identité] 19 ans). Ex-mari M. [identité] [identité], relations conflictuelles. Sœur Mme [identité] [identité], soutenante. Mère âgée, malade (cancer du pancréas).\nBiologie des urgences : GGT 312, VGM 104, ASAT/ALAT 98/54.\nConclusions :\nTUAL sévère, symptomatologie dépressive à réévaluer après sevrage.\nSevrage résidentiel programmé le 05/12/2022 (10 jours). Thiamine dès maintenant. Pas d'antidépresseur pour l'instant."}, "historique:o4": {"label": "historique · Observation médicale d'entrée", "date": "2022-12-05", "text": "Observations :\nEntrée programmée pour sevarge d'alcool chez une patiente de 50 ans suivie par le Dr [identité].\nDernière consommation ce matin à 7h (\"un verre pour pouvoir conduire jusqu'ici\", ce qui pose question concernant la conduite automobile, à rediscuter avec elle). La patiente rapporte une consommation d'environ 1 litre de vin par jour depuis \"une dizaine d'années\", soit depuis 2012-2013, avec une nette majoration au moment du divorce qu'elle situe en 2017.\nPas d'antécédent de convulsions ni de délirium tremens. Tabagisme actif estimé à 15 paquets-années.\nÀ l'examen : TA 152/94, FC 104, sueurs, tremblements des extrémités, Cushman 7. Plâtre de l'avant-bras G en place (fracture du radius du 14/11).\nSur le plan thymique, la patiente apparaît triste, pleure à l'évocation de ses enfants et de sa mère hospitalisée. Je retiens plutôt un trouble de l'adaptation avec humeur dépressive dans ce contexte, mais une dépression caractérisée n'est pas exclue.\nConclusions :\nSevrage par diazépam selon protocole Cushman (40 mg à J1), thiamine 500 mg/j IV pendant 3 jours puis per os, hydratation. Surveillance Cushman toutes les 4h. Bilan : NFS, iono, BHC, TP, CDT. Échographie hépatique à prévoir."}, "historique:o5": {"label": "historique · Observation infirmière", "date": "2022-12-06", "text": "Nuit agitee. Pte reveillee a 1h, sueurs ++, tremblements, dit voir \"des petites betes sur le mur\" puis critique. Cushman 11 a 1h -> diazepam 20mg selon protocole, Cushman 6 a 3h. TA 158/96. Hydratation PO ok.\nRassurée, s'est rendormie vers 3h30. Appel au med de garde (Dr [identité]) : pas de modif du ttt, surveillance rapprochée."}, "historique:o6": {"label": "historique · Observation médicale de suivi", "date": "2022-12-07", "text": "Observations :\nJ3 du sevrage. Hallucinations visuelles transitoires cette nuit (cf. transmissions IDE), critiquées, sans désorientation : pas d'argument pour un DT. Cushman 4 ce matin. Décroissance du diazépam : 30 mg/j.\nBilan biologique : GGT 287, VGM 103, TP 78 %, plaquettes 132 G/L, CDT 4,1 %.\nLa patiente se dit \"soulagée d'être là\". Évoque un premier sevrage \"en 2018 ou 2019\", elle ne sait plus.\nConclusions :\nPoursuite de la décroissance. Introduction de l'acamprosate à discuter en fin de séjour. Échographie abdominale demandée."}, "historique:o7": {"label": "historique · Entretien psychologique", "date": "2022-12-12", "text": "Premier entretien. Mme [identité] parle facilement, avec beaucoup d'émotion. Elle situe le \"début de la descente\" au départ de son mari, qu'elle décrit comme un homme \"froid, qui comptait chaque centime\". Elle dit avoir \"tenu pour les enfants\" jusqu'à ce que sa fille parte faire ses études.\nL'alcool est décrit comme un \"anesthésiant\" : le soir d'abord, puis \"dès que la maison est vide\". Forte culpabilité vis-à-vis de son fils, qui l'a retrouvée au sol.\nElle évoque sa mère, hospitalisée, avec qui la relation est ambivalente (\"elle ne m'a jamais dit qu'elle était fière de moi\").\nBonne capacité d'élaboration. Demande un suivi après la sortie, qu'elle souhaite \"plutôt en TCC, pour avoir des outils\".\nProposition : suivi psychologique au CSAPA après la sortie, un entretien tous les 15 jours."}, "historique:o8": {"label": "historique · Observation médicale de sortie", "date": "2022-12-16", "text": "Observations :\nSevrage mené à terme sans complication majeure (hallucinations visuelles transitoires à J2, sans DT). Arrêt du diazépam ce jour. Cushman 0.\nThymie : persistance d'une tristesse, d'une anhédonie et de réveils précoces malgré l'arrêt de l'alcool. Pas d'idées suicidaires.\nÉchographie : stéatose hépatique homogène, pas de signe d'hypertension portale.\nConclusions :\nSortie ce jour. Traitement : acamprosate 333 mg 2-2-2, thiamine 250 mg/j. Contrôle ortho le 20/12.\nSuivi au CSAPA : consultation psychiatrique le 10/01/2023, psychologue (Mme [identité]) tous les 15 jours, IDE hebdomadaire.\nCourrier au médecin traitant (Dr [identité])."}, "historique:o9": {"label": "historique · Entretien social", "date": "2023-01-03", "text": "Entretien à la demande de Mme [identité] pour sa situation professionnelle et financière.\nAide-soignante à l'EHPAD Les Glycines (CDI), en arrêt maladie depuis le 12/09/2022. IJ versées avec 2 mois de retard. Découvert bancaire important. Pension alimentaire non versée par l'ex-mari depuis l'été.\nMme [identité] évoque des fêtes de fin d'année difficiles : elle a passé Noël chez sa sœur, où elle \"a bu quelques verres de champagne puis n'a pas pu s'arrêter\" le 25 au soir. Elle n'a pas osé en parler à l'équipe.\nElle souhaite reprendre le travail \"le plus tôt possible\".\nDémarches : courrier à la CPAM pour régulariser les IJ, visite de pré-reprise auprès du médecin du travail, information sur le recouvrement de la pension (CAF / ARIPA).\nProchain RDV le 17/01/2023."}, "historique:o10": {"label": "historique · Consultation psychiatrique addictologie", "date": "2023-01-10", "text": "Observations :\nRevue 3 semaines après la sortie. Dit être abstinente depuis la sortie le 16/12, avec un craving important en soirée. Bonne observance de l'acamprosate.\nThymie : humeur triste, anhédonie, aboulie, ralentissement, insomnie de fin de nuit, perte de 4 kg en 2 mois. Ces symptômes persistent après 3 semaines d'abstinence : en faveur d'un épisode dépressif caractérisé d'intensité moyenne, plutôt que d'un trouble de l'adaptation. Pas d'idées suicidaires.\nAblation du plâtre ce jour en orthopédie.\nConclusions :\nEDC d'intensité moyenne. TUAL sévère en début de rémission.\nIntroduction de sertraline 50 mg/j. Poursuite de l'acamprosate. GGT de contrôle. RDV dans 1 mois."}, "historique:o11": {"label": "historique · Observation infirmière CSAPA", "date": "2023-01-24", "text": "Pte vue pour ctrl bio + entretien. GGT 198 (287 en dec.) : en baisse mais pas normalisée. Dit avoir \"craqué une fois à Noël\" mais rien depuis. Ethylotest 0,00. Pas de tremblements.\nTolère bien la sertraline, un peu nauséeuse les premiers jours.\nFume 10 cig/jour, voudrait arreter \"mais pas maintenant\"."}, "historique:o12": {"label": "historique · Consultation psychiatrique addictologie", "date": "2023-02-21", "text": "Observations :\nCraving persistant. Deux épisodes de consommation début février (vin, \"une bouteille\" à chaque fois), sans reprise quotidienne. Acamprosate jugé peu efficace par la patiente.\nThymie un peu meilleure, sommeil amélioré. Sertraline 50 mg bien tolérée.\nConclusions :\nArrêt de l'acamprosate, relais par baclofène : 10 mg x3/j, augmentation de 10 mg tous les 3 jours, objectif 60 mg/j à réévaluer. Informée des effets indésirables (somnolence, vertiges) et de la contre-indication à la conduite pendant la titration.\nRDV dans 3 semaines."}, "historique:o13": {"label": "historique · Entretien psychologique", "date": "2023-05-10", "text": "Séance marquée par le décès de sa mère, survenu \"il y a une dizaine de jours\". Mme [identité] dit ne pas avoir eu le temps de \"se réconcilier\". Elle a beaucoup pleuré aux obsèques et décrit une envie de boire \"énorme\", à laquelle elle a résisté \"grâce à [identité] qui dormait à la maison\".\nTravail sur le deuil et sur les situations à risque (soirées seule, dimanches).\nElle dit prendre le baclofène \"à 50\" et ne pas avoir bu depuis \"début mars\"."}, "historique:o14": {"label": "historique · Consultation psychiatrique addictologie", "date": "2023-06-13", "text": "Observations :\nAggravation thymique depuis le décès de sa mère fin avril. Ruminations, culpabilité, insomnie. Idées de mort passives (\"parfois je me dis que ce serait plus simple de ne pas se réveiller\"), sans projet ni scénario, critiquées. Facteurs de protection : ses enfants.\nAbstinence d'alcool maintenue depuis mars selon la patiente. Baclofène 60 mg/j (20-20-20), bien toléré.\nConclusions :\nAugmentation de la sertraline à 100 mg/j. Numéro du 3114 donné. Consultations rapprochées (tous les 15 jours). Poursuite de la psychothérapie."}, "historique:o15": {"label": "historique · Observation infirmière CSAPA", "date": "2023-06-15", "text": "Appel tel de la pte : nausées et diarrhées depuis l'augmentation de la sertraline a 150mg (?). Verif ordonnance : 100 mg prescrits. La pte avait mal compris, prenait 3 cp de 50. Explications données, plan de prise réécrit. Rappel prévu demain."}, "historique:o16": {"label": "historique · Consultation psychiatrique addictologie", "date": "2023-09-19", "text": "Observations :\nNette amélioration. Thymie normalisée, sommeil réparateur. Reprise du travail en mi-temps thérapeutique depuis le 04/09/2023 à l'EHPAD, \"contente de retrouver les collègues\".\nAbstinence complète depuis mars 2023 (6 mois), CDT normale, GGT 54.\nTabac réduit à 5 cig/j, envisage des substituts nicotiniques.\nConclusions :\nTUAL en rémission précoce. EDC en rémission partielle. Poursuite sertraline 100 mg et baclofène 60 mg. Patchs nicotiniques 14 mg/24h. RDV dans 2 mois."}, "historique:o17": {"label": "historique · Observation infirmière CSAPA", "date": "2024-01-23", "text": "Mme [identité] venue sans RDV, en pleurs. A rebu depuis 10 jours environ, \"tous les soirs\", jusqu'à 6 verres de vin. Déclencheur : départ de son fils [identité] pour Toulouse (formation) début janvier, la maison est vide. Pas d'alcoolisation matinale pour l'instant. Ethylotest 0,32 g/L à 16h.\nA arreté le baclofène \"depuis Noël\" car \"ça ne servait plus à rien\".\nPas d'idée suicidaire exprimée. Vu avec dr [identité] : RDV avancé au 25/01."}, "historique:o18": {"label": "historique · Consultation psychiatrique addictologie", "date": "2024-01-25", "text": "Observations :\nReprise des consommations depuis la mi-janvier 2024 (\"depuis les fêtes\" selon la patiente), 4 à 6 UIA/j le soir, pas de consommation matinale, pas de signe de sevrage. Arrêt du baclofène fin décembre, de sa propre initiative.\nThymie : tristesse réactionnelle, pas d'éléments en faveur d'une rechute dépressive franche. Sertraline poursuivie.\nConclusions :\nRechute du TUAL sans dépendance physique à ce stade. Reprise du baclofène avec titration jusqu'à 60 mg/j. Objectif de réduction puis d'abstinence discuté : la patiente préfère \"réduire d'abord\". Suivi IDE hebdomadaire, psychologue maintenue. RDV dans 3 semaines."}}, "ref": "2024-02-01", "kinds": [{"id": "life_event", "label": "Événements de vie", "light": "#b45309", "dark": "#f59e0b"}, {"id": "substance_use", "label": "Consommations", "light": "#c62828", "dark": "#ef6b6b"}, {"id": "psychiatric", "label": "Psychopathologie", "light": "#6a4bb0", "dark": "#a78bfa"}, {"id": "somatic", "label": "Somatique", "light": "#0f7b6c", "dark": "#34d3b9"}, {"id": "medication", "label": "Médicaments", "light": "#1d5fb4", "dark": "#6aa6f0"}, {"id": "therapeutic_psycho", "label": "Prises en charge", "light": "#4d7c0f", "dark": "#a3d95b"}], "modeLabel": {"usage": "usage", "intoxication": "intoxication", "sevrage": "sevrage", "rechute": "rechute", "craving": "craving"}, "certaintyLabel": {"exact": "date exacte", "month": "mois", "year": "année", "approx": "date approximative"}};
const NS = "http://www.w3.org/2000/svg";

const REF = t(D.ref);
const kindOf = Object.fromEntries(D.kinds.map(k => [k.id, k]));

const color = (kind) => kindOf[kind][dark() ? "dark" : "light"];
const MODE_OP = {usage:.55, craving:.7, sevrage:.7, intoxication:.85, rechute:1};
const EVENTS = D.events.map((e, i) => ({
  ...e, i, kind: trackOf[e.track].kind, label: trackOf[e.track].label,
  a: t(e.s), b: e.e ? t(e.e) : (e.ongoing ? REF : t(e.s)),

const hidden = new Set();
let LABEL_W = 150; const ROW = 26, PADR = 14, AXIS = 84;
let DOM_MIN = Math.min(...EVENTS.map(e => e.a)) - 200*DAY, DOM_MAX = REF + 60*DAY;
let view = [DOM_MIN, DOM_MAX];

const el = (name, attrs = {}, parent, text) => {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;

};
const fmt = (s) => { if (!s) return ""; const [y,m,d] = s.split("-"); return d ? `${d}/${m}/${y}` : m ? `${m}/${y}` : y; };
const yr = (ms) => new Date(ms).getUTCFullYear();

function ticks(a, b) {
  const span = (b - a) / (365.25*DAY), out = [];
  const step = span > 40 ? 10 : span > 18 ? 5 : span > 9 ? 2 : span > 3.5 ? 1 : 0;
  if (step) { for (let y = Math.ceil(yr(a)/step)*step; Date.UTC(y,0,1) <= b; y += step) out.push([Date.UTC(y,0,1), String(y), true]); }

const bolt = (x, y, s=7) => `M${x} ${y-s} L${x-s*.55} ${y+.1} L${x-.05*s} ${y+.1} L${x-s*.35} ${y+s} L${x+s*.6} ${y-.25*s} L${x+.05*s} ${y-.25*s} Z`;

function drawMain() {

  svg.replaceChildren();
  const W = svg.clientWidth || 800;
  LABEL_W = W < 600 ? 92 : 150;
  const innerW = W - LABEL_W - PADR;

  const defs = el("defs", {}, svg);

    el("text", {x: xx + 3, y: H - 7, class: "mute"}, gridG, lab);
  }
  el("line", {x1: LABEL_W, x2: W - PADR, y1: AXIS - 4, y2: AXIS - 4, stroke: "var(--axis)", "stroke-width": 4, "stroke-linecap": "round"}, svg);
  const g = el("g", {"clip-path": "url(#clip)"}, svg);
  // life events on the axis
  if (showLife) {
    const life = EVENTS.filter(e => e.kind === "life_event" && e.b >= view[0] && e.a <= view[1]);
    const lanes = [[], [], [], [], []];
    for (const e of life.sort((p, q) => p.a - q.a)) {
      const pt = e.point || (e.b - e.a) < 120*DAY;
      const xa = x(Math.max(e.a, view[0])), xb = pt ? xa : x(Math.min(e.b, view[1]));
      const w = e.label.length * 5.9 + 10, flip = xa + w > W - PADR;
      const iv = flip ? [xa - w, xa + 4] : [xa - 4, xa + w];
      let ln = lanes.findIndex(l => l.every(o => o[1] < iv[0] || o[0] > iv[1]));
      if (ln < 0) ln = lanes.length - 1;
      lanes[ln].push(iv);
      const ty = AXIS - 14 - ln * 13 - 4;
      const grp = el("g", {class: "ev", "data-i": e.i}, g);
      if (!pt) el("rect", {x: xa, y: AXIS - 8, width: Math.max(2, xb - xa), height: 8, rx: 3, fill: color("life_event"), opacity: .85}, grp);
      else el("path", {d: `M${xa} ${AXIS-11} l6 6 l-6 6 l-6 -6 Z`, fill: color("life_event")}, grp);
      el("line", {x1: xa, x2: xa, y1: ty + 3, y2: AXIS - 11, stroke: color("life_event"), "stroke-width": 1, opacity: .6}, grp);
      el("text", {x: flip ? xa - 3 : xa + 3, y: ty, "font-size": 11, "text-anchor": flip ? "end" : "start", "pointer-events": "none"}, grp, e.label);
      if (e.loss) el("path", {d: bolt(xa, AXIS + 6, 6), fill: "#e11d48"}, grp);
    }
  }
  // rows
  let y = AXIS + 6;
  for (const r of rows) {
    if (r.head) {
      el("text", {x: 6, y: y + 17, "font-weight": 600, fill: color(r.head.id)}, svg, r.head.label.toUpperCase()).setAttribute("font-size", 11);
      el("line", {x1: 6, x2: W - PADR, y1: y + ROW - 3, y2: y + ROW - 3, stroke: color(r.head.id), opacity: .35}, svg);
    } else {
      const cut = W < 600 ? 13 : 24;
      const lab = r.track.label.length > cut ? r.track.label.slice(0, cut - 1) + "…" : r.track.label;
      el("text", {x: 12, y: y + 17, class: "mute"}, svg, lab).appendChild(Object.assign(document.createElementNS(NS, "title"), {textContent: r.track.label}));
      for (const e of EVENTS.filter(e => e.track === r.track.id)) {
        if (e.b < view[0] || e.a > view[1]) continue;
        const grp = el("g", {class: "ev", "data-i": e.i}, g);
        const c = color(e.kind), op = e.mode ? (MODE_OP[e.mode] ?? .6) : .8;
        const xa = x(e.a), xb = x(e.b);
        const dash = e.certainty === "approx" || e.ageNote ? "4 3" : null;
        if (e.point || xb - xa < 5) {
          const pt = el("path", {d: `M${xa} ${y+5} l7 7 l-7 7 l-7 -7 Z`, fill: c, opacity: op}, grp);
          if (dash) { pt.setAttribute("stroke", c); pt.setAttribute("stroke-dasharray", "2 2"); pt.setAttribute("fill-opacity", .45); }
        } else {
          const rc = el("rect", {x: xa, y: y + 4, width: xb - xa, height: ROW - 10, rx: 4, fill: c, opacity: op}, grp);
          if (dash) { rc.setAttribute("stroke", c); rc.setAttribute("stroke-dasharray", dash); rc.setAttribute("fill-opacity", .45); }
          if (e.ongoing && xb < W) el("path", {d: `M${xb} ${y+4} l8 ${(ROW-10)/2} l-8 ${(ROW-10)/2} Z`, fill: c, opacity: op}, grp);
        }
        if (e.loss) el("path", {d: bolt(xa, y + ROW/2 - 1), fill: "#e11d48", stroke: "var(--panel)", "stroke-width": .8}, grp);
        if (e.mode && e.mode !== "usage" && xb - xa > 56) el("text", {x: xa + 6, y: y + 17, fill: "#fff", "font-size": 10.5, "pointer-events": "none"}, grp, MODE_LABEL(e.mode)).setAttribute("style", "fill:#fff");
      }

  svg.querySelectorAll(".ev").forEach(n => {

  });
  if (selected !== null) svg.querySelector(`.ev[data-i="${selected}"]`)?.classList.add("sel");
}
const MODE_LABEL = (m) => D.modeLabel[m] || m;

let selected = null;
function obsHtml(v, esc) {

  html += esc(o.text.slice(at));
  return `<div class="obs"><div class="oh">${o.date ? esc(o.date) + " · " : ""}${esc(o.label)}${o.summary_only ? " · résumé" : ""}</div><div class="ot">${html}</div></div>`;
}
function select(i) {
  selected = i;
  document.querySelectorAll(".ev").forEach(n => n.classList.toggle("sel", +n.dataset.i === i));
  const e = EVENTS[i];
  const when = e.endLabel ? (e.startLabel === e.endLabel ? fmt(e.startLabel) : `${fmt(e.startLabel)} → ${fmt(e.endLabel)}`)
    : e.ongoing ? `depuis ${fmt(e.startLabel)} (en cours)` : fmt(e.startLabel);
  const esc = (s) => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const bits = [];
  if (e.mode) bits.push(MODE_LABEL(e.mode));
  if (e.certainty) bits.push(D.certaintyLabel[e.certainty] || e.certainty);
  if (e.ageNote) bits.push(e.ageNote);
  if (e.loss) bits.push("⚡ perte de contrôle");
  document.getElementById("detail").innerHTML =
    `<b>${esc(e.label)}</b> <span class="k">· ${esc(kindOf[e.kind].label)} · ${when}${bits.length ? " · " + esc(bits.join(" · ")) : ""}</span>` +
    (e.note ? `<div>${esc(e.note)}</div>` : "") +
    (e.sources.length ? `<div class="k">Autres sources : ${e.sources.map(esc).join(" ; ")}</div>` : "") +
    (e.evidence.length ? `<div class="k" style="margin-top:8px">${e.evidence.length > 1 ? "Observations" : "Observation"} d'origine${e.evidence.some(v => !v.marks.length) ? " (passage justificatif non repéré dans certaines)" : ", passage justificatif surligné"} :</div><div id="obs">` +
      e.evidence.map(v => obsHtml(v, esc)).join("") + `</div>` : "");
  document.querySelector("#obs mark")?.scrollIntoView({block: "nearest"});
}

// overview strip with a draggable window
function drawOverview() {
  const svg = document.getElementById("ov");
  svg.replaceChildren();
  const W = svg.clientWidth || 800, H = 54, L = 12, R = 12, innerW = W - L - R;
  const x = (ms) => L + (ms - DOM_MIN) / (DOM_MAX - DOM_MIN) * innerW;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  for (const [v, lab, major] of ticks(DOM_MIN, DOM_MAX)) {
    if (!major) continue;
    el("line", {x1: x(v), x2: x(v), y1: 4, y2: H - 14, stroke: "var(--line)"}, svg);
    el("text", {x: x(v) + 2, y: H - 3, class: "mute", "font-size": 10}, svg, lab);
  }
  const vis = EVENTS.filter(e => !hidden.has(e.kind));
  const n = Math.max(1, new Set(vis.map(e => e.track)).size), tracks = [...new Set(vis.map(e => e.track))];
  for (const e of vis) {
    const r = tracks.indexOf(e.track), yy = 6 + r * (H - 24) / n;
    el("rect", {x: x(e.a), y: yy, width: Math.max(2, x(e.b) - x(e.a)), height: Math.max(1.5, (H - 24) / n - 1), fill: color(e.kind), opacity: .7}, svg);
  }
  const win = el("rect", {x: x(view[0]), y: 1, width: Math.max(10, x(view[1]) - x(view[0])), height: H - 14, rx: 5, fill: "rgba(80,120,220,.16)", stroke: "#4f7be0", "stroke-width": 1.5, style: "cursor:grab"}, svg);
  const hl = el("rect", {x: x(view[0]) - 5, y: 1, width: 10, height: H - 14, fill: "#4f7be0", opacity: .01, style: "cursor:ew-resize"}, svg);
  const hr = el("rect", {x: x(view[1]) - 5, y: 1, width: 10, height: H - 14, fill: "#4f7be0", opacity: .01, style: "cursor:ew-resize"}, svg);
  const inv = (px) => DOM_MIN + (px - L) / innerW * (DOM_MAX - DOM_MIN);
  const MINSPAN = 120 * DAY;
  const drag = (node, kind) => node.addEventListener("pointerdown", (ev) => {
    ev.preventDefault(); node.setPointerCapture(ev.pointerId);
    const x0 = ev.clientX, v0 = [...view], per = (DOM_MAX - DOM_MIN) / innerW;
    const move = (m) => {
      const d = (m.clientX - x0) * per;
      let [a, b] = v0;
      if (kind === "move") { const span = b - a; a = Math.min(Math.max(DOM_MIN, a + d), DOM_MAX - span); b = a + span; }
      else if (kind === "l") a = Math.min(Math.max(DOM_MIN, a + d), b - MINSPAN);
      else b = Math.max(Math.min(DOM_MAX, b + d), a + MINSPAN);
      view = [a, b]; drawOverview(); drawMain();
    };
    const up = () => { node.removeEventListener("pointermove", move); node.removeEventListener("pointerup", up); };
    node.addEventListener("pointermove", move); node.addEventListener("pointerup", up);
  });
  drag(win, "move"); drag(hl, "l"); drag(hr, "r");
}

function setView(a, b) { view = [Math.max(DOM_MIN, a), Math.min(DOM_MAX, b)]; redraw(); }
function redraw() { drawOverview(); drawMain(); }

// controls
const kindsBar = document.getElementById("kinds");
for (const k of D.kinds) {
  const b = document.createElement("button"); b.className = "chip"; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<i style="background:${k[dark() ? "dark" : "light"]}"></i>${k.label}`;
  b.onclick = () => { hidden.has(k.id) ? hidden.delete(k.id) : hidden.add(k.id); b.setAttribute("aria-pressed", String(!hidden.has(k.id))); redraw(); };
  kindsBar.appendChild(b);
}
const presets = document.getElementById("presets");
const addPreset = (label, fn) => { const b = document.createElement("button"); b.textContent = label; b.onclick = fn; presets.appendChild(b); };
addPreset("Tout", () => setView(DOM_MIN, DOM_MAX));
for (const yrs of [10, 5, 2]) addPreset(`${yrs} dernières années`, () => setView(REF - yrs * 365.25 * DAY, DOM_MAX));
addPreset("−", () => { const c = (view[0] + view[1]) / 2, h = (view[1] - view[0]); setView(c - h, c + h); });
addPreset("+", () => { const c = (view[0] + view[1]) / 2, h = (view[1] - view[0]) / 4; setView(c - h, c + h); });
document.getElementById("legend").innerHTML =
  `<span><span class="sw" style="background:#888;opacity:.55"></span>usage</span><span><span class="sw" style="background:#888;opacity:.85"></span>intoxication</span>` +
  `<span><span class="sw" style="background:#888"></span>rechute</span><span><span class="sw" style="background:#888;opacity:.45;border:1px dashed #888"></span>date approximative ou d'après l'âge</span>` +
  `<span style="color:#e11d48">⚡ perte de contrôle</span><span>◆ événement sans durée</span><span>▶ en cours</span>`;
document.getElementById("main").addEventListener("wheel", (ev) => {
  if (!ev.ctrlKey && !ev.shiftKey) return;
  ev.preventDefault();
  const r = ev.currentTarget.getBoundingClientRect(), W = r.width, f = (ev.clientX - r.left - LABEL_W) / (W - LABEL_W - PADR);
  const c = view[0] + Math.min(Math.max(f, 0), 1) * (view[1] - view[0]), k = ev.deltaY > 0 ? 1.25 : .8;
  setView(c - (c - view[0]) * k, c + (view[1] - c) * k);
}, {passive: false});
addEventListener("resize", redraw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
if (innerWidth < 600) view = [Math.max(DOM_MIN, REF - 5 * 365.25 * DAY), DOM_MAX];
redraw();
</script>
</body>
</html>
