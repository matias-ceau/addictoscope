nger, prévenir son compagnon, matériel.\nConclusions :\nPas de modification du traitement\nRDV 2 mois"}, "historique:o3": {"label": "historique · Observation psychiatrique de suivi", "date": "2025-02-18", "text": "Observations :\nVu ce jour\nAbstinent depuis octobre (4 mois), pas de GHB, pas de cathinones. Reprise a temps plein depuis le 01/02, bonne réintégration dans l'équipe.\nNouvelle relation depuis quelques semaines, rencontre en dehors des applications.\nThymie neutre a légèrement positive, sommeil restauré. Plus d'idées noires.\nConclusions :\nRO escitalopram 15 mg\nRDV 2 mois"}, "historique:o4": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-12-03", "text": "Observations :\nVu ce jour en entretien :\nRevient sur octobre : parle cette fois d'\"une seule session\", le 12/10, avec slam de 3-MMC et GHB. Minimise par rapport à l'entretien téléphonique.\nDepuis : pas de consommations, a supprimé les applications de rencontre (travail avec Mme [identité]). Dimanches toujours difficiles.\nThymie légèrement abaissée, pas d'idées suicidaires.\nIntéressé par le groupe de parole de l'association communautaire, coordonnées données.\nConclusions :\nEscitalopram 15 mg inchangé\nRDV 1 mois"}, "historique:o5": {"label": "historique · Entretien psychologique", "date": "2024-11-05", "text": "6e séance. Reprise après la rechute d'octobre. [identité] décrit le \"tunnel\" qui précède les sessions : dimanche seul, appli ouverte \"juste pour regarder\", puis les messages. Il situe le début de ses sessions \"au premier confinement, quand tout s'est arrêté\".\nTravail sur la chaîne comportementale et les alternatives (appeler un ami, sport en salle le dimanche matin). Décide de supprimer les applis.\nHonte moins envahissante qu'au début du suivi."}, "historique:o6": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-10-22", "text": "Observations :\nEntretien téléphonique, rappelé à sa demande (message au secrétariat).\nRechute : sessions les deux week-ends précédents (12/10 et 19/10), slam 3-MMC + GHB. Pas de perte de connaissance. Contexte : départ de [identité], appartement vide, appli réinstallée.\nIdées noires passives à la descente, pas de scénario, pas d'intention. Accepte un RDV rapide.\nHospitalisation proposée : refus, préfère ambulatoire, garde son travail.\nConclusions :\nRDV présentiel le 25/10 (créneau d'urgence)\nRappel RdR, numéro de la ligne d'écoute donné"}, "historique:o7": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-09-10", "text": "Observations :\nVu ce jour\nReprise du travail en mi-temps thérapeutique depuis le 02/09. Fatigabilité, mais content.\nSéparation : [identité] est parti début septembre (\"on s'aimait plus que comme des colocs\"). Tristesse, pleurs, mais dit \"tenir\".\nPas de GHB, pas de 3-MMC depuis juillet.\nConclusions :\nEscitalopram 15 mg\nRDV 1 mois, plus tôt si besoin"}, "historique:o8": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-07-30", "text": "Observations :\nVu ce jour\nSyphilis traitée le 25/07 au CeGIDD (extencilline une injection).\nPas de GHB depuis l'entrée en sevrage le 10/06. Une session de 3-MMC sniffée mi-juillet, sans GHB, avec un ami, sans sexe. Dit avoir eu \"peur de lui-meme\" et etre parti tot.\nThymie remontée, élan vital meilleur, dort 7h.\nConclusions :\nProlongation arret de travail jusqu'au 01/09 puis mi-temps thérapeutique (accord MT)\nRDV septembre"}, "historique:o9": {"label": "historique · Entretien infirmier", "date": "2024-07-09", "text": "Entretien IDE de suivi. M. [identité] sorti de l'unité de sevrage le 14/06, pas de GHB depuis.\nRésultats du bilan : VIH négatif, VHC négatif, VHB vacciné. TPHA/VDRL positifs : recontamination syphilitique probable (traitée en 2022). Orienté au CeGIDD, RDV le 25/07.\nMise à jour coordonnées : [identité], 33800 BORDEAUX, tél [identité], mail [identité]."}, "historique:o10": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-06-20", "text": "Observations :\nVu ce jour, sorti le 17/06 apres 7 jours de sevrage GHB en hospitalisation.\nSevrage sévère les 48 premières heures (tremblements, agitation, insomnie totale, tachycardie) controlé par diazépam a doses élevées + baclofène. Pas de confusion, pas de crise.\nActuellement : diazépam arreté à la sortie, baclofène 30 mg/j en décroissance sur 2 semaines.\nSoulagé, mais peur de la suite, \"le dimanche sans rien\". Thymie basse.\nConclusions :\nEscitalopram majoré à 15 mg\nArret de travail prolongé\nBaclofène : schéma de décroissance remis"}, "historique:o11": {"label": "historique · Observation Cadre de Santé", "date": "2024-06-03", "text": "Observations :\nCoordination avec l'unité de sevrage : entrée confirmée le 10/06 pour sevrage GHB/GBL, durée prévue 7 a 10 jours.\nPatient prévenu par téléphone, consigne de ne pas arreter brutalement le GBL avant l'entrée (risque de sevrage grave), ne pas conduire.\nConclusions :"}, "historique:o12": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-05-21", "text": "Observations :\nVu ce jour en urgence, à sa demande.\nComa au GHB samedi 18/05 au cours d'une session : GBL + alcool, retrouvé inconscient par un partenaire, SAMU, intubation et une nuit en réanimation, sorti le 19/05.\nTrès choqué. Révèle ce jour une prise quotidienne de GBL a domicile depuis le début d'année, toutes les 2-3 heures y compris la nuit \"pour dormir et pour tenir\", ce qu'il n'avait pas dit lors de l'évaluation. Dépendance physique probable (tremblements au réveil, anxiété majeure entre deux prises).\nDemande d'arret. Sevrage ambulatoire non indiqué au vu de la sévérité.\nConclusions :\n- Demande d'hospitalisation pour sevrage GHB (unité de sevrage)\n- Arret de travail 3 semaines\n- Consignes : pas d'arret brutal, pas d'alcool, ne pas consommer seul en attendant"}, "historique:o13": {"label": "historique · Entretien psychologique", "date": "2024-04-16", "text": "Premier entretien. [i   const when = e.endLabel ? (e.startLabel === e.endLabel ? fmt(e.startLabel) : `${fmt(e.startLabel)} → ${fmt(e.endLabel)}`)
    : e.ongoing ? `depuis ${fmt(e.startLabel)} (en cours)` : fmt(e.startLabel);
  const esc = (s) => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const bits = [];
  if (e.mode) bits.push(MODE_LABEL(e.mode));
  if (e.certainty) bits.push(D.certaintyLabel[e.certainty] || e.certainty);
  if (e.loss) bits.push("⚡ perte de contrôle");
  document.getElementById("detail").innerHTML =
    `<b>${esc(e.label)}</b> <span class="k">· ${esc(kindOf[e.kind].label)} · ${when}${bits.length ? " · " + esc(bits.join(" · ")) : ""}</span>` +
    (e.note ? `<div>${esc(e.note)}</div>` : "") +
    (e.sources.length ? `<div class="k">Autres sources : ${e.sources.map(esc).join(" ; ")}</div>` : "") +
    (e.evidence.length ? `<div class="k" style="margin-top:8px">${e.evidence.length > 1 ? "Observations" : "Observation"} d'origine${e.evidence.some(v => !v.marks.length) ? " (passage justificatif non repéré dans certaines)" : ", passage justificatif surligné"} :</div><div id="obs">` +
      e.evidence.map(v => obsHtml(v, esc)).join("") + `</div>` : "");
  document.querySelector("#obs mark")?.scrollIntoView({block: "nearest"});
}

// overview strip with a draggable window
function drawOverview() {
  const svg = document.getElementById("ov");
  svg.replaceChildren();
  const W = svg.clientWidth || 800, H = 54, L = 12, R = 12, innerW = W - L - R;
  const x = (ms) => L + (ms - DOM_MIN) / (DOM_MAX - DOM_MIN) * innerW;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  for (const [v, lab, major] of ticks(DOM_MIN, DOM_MAX)) {
    if (!major) continue;
    el("line", {x1: x(v), x2: x(v), y1: 4, y2: H - 14, stroke: "var(--line)"}, svg);
    el("text", {x: x(v) + 2, y: H - 3, class: "mute", "font-size": 10}, svg, lab);
  }
  const vis = EVENTS.filter(e => !hidden.has(e.kind));
  const n = Math.max(1, new Set(vis.map(e => e.track)).size), tracks = [...new Set(vis.map(e => e.track))];
  for (const e of vis) {
    const r = tracks.indexOf(e.track), yy = 6 + r * (H - 24) / n;
    el("rect", {x: x(e.a), y: yy, width: Math.max(2, x(e.b) - x(e.a)), height: Math.max(1.5, (H - 24) / n - 1), fill: color(e.kind), opacity: .7}, svg);
  }
  const win = el("rect", {x: x(view[0]), y: 1, width: Math.max(10, x(view[1]) - x(view[0])), height: H - 14, rx: 5, fill: "rgba(80,120,220,.16)", stroke: "#4f7be0", "stroke-width": 1.5, style: "cursor:grab"}, svg);
  const hl = el("rect", {x: x(view[0]) - 5, y: 1, width: 10, height: H - 14, fill: "#4f7be0", opacity: .01, style: "cursor:ew-resize"}, svg);
  const hr = el("rect", {x: x(view[1]) - 5, y: 1, width: 10, height: H - 14, fill: "#4f7be0", opacity: .01, style: "cursor:ew-resize"}, svg);
  const inv = (px) => DOM_MIN + (px - L) / innerW * (DOM_MAX - DOM_MIN);
  const MINSPAN = 120 * DAY;
  const drag = (node, kind) => node.addEventListener("pointerdown", (ev) => {
    ev.preventDefault(); node.setPointerCapture(ev.pointerId);
    const x0 = ev.clientX, v0 = [...view], per = (DOM_MAX - DOM_MIN) / innerW;
    const move = (m) => {
      const d = (m.clientX - x0) * per;
      let [a, b] = v0;
      if (kind === "move") { const span = b - a; a = Math.min(Math.max(DOM_MIN, a + d), DOM_MAX - span); b = a + span; }
      else if (kind === "l") a = Math.min(Math.max(DOM_MIN, a + d), b - MINSPAN);
      else b = Math.max(Math.min(DOM_MAX, b + d), a + MINSPAN);
      view = [a, b]; drawOverview(); drawMain();
    };
    const up = () => { node.removeEventListener("pointermove", move); node.removeEventListener("pointerup", up); };
    node.addEventListener("pointermove", move); node.addEventListener("pointerup", up);
  });
  drag(win, "move"); drag(hl, "l"); drag(hr, "r");
}

function setView(a, b) { view = [Math.max(DOM_MIN, a), Math.min(DOM_MAX, b)]; redraw(); }
function redraw() { drawOverview(); drawMain(); }

// controls
const kindsBar = document.getElementById("kinds");
for (const k of D.kinds) {
  const b = document.createElement("button"); b.className = "chip"; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<i style="background:${k[dark() ? "dark" : "light"]}"></i>${k.label}`;
  b.onclick = () => { hidden.has(k.id) ? hidden.delete(k.id) : hidden.add(k.id); b.setAttribute("aria-pressed", String(!hidden.has(k.id))); redraw(); };
  kindsBar.appendChild(b);
}
const presets = document.getElementById("presets");
const addPreset = (label, fn) => { const b = document.createElement("button"); b.textContent = label; b.onclick = fn; presets.appendChild(b); };
addPreset("Tout", () => setView(DOM_MIN, DOM_MAX));
for (const yrs of [10, 5, 2]) addPreset(`${yrs} dernières années`, () => setView(REF - yrs * 365.25 * DAY, DOM_MAX));
addPreset("−", () => { const c = (view[0] + view[1]) / 2, h = (view[1] - view[0]); setView(c - h, c + h); });
addPreset("+", () => { const c = (view[0] + view[1]) / 2, h = (view[1] - view[0]) / 4; setView(c - h, c + h); });
document.getElementById("legend").innerHTML =
  `<span><span class="sw" style="background:#888;opacity:.55"></span>usage</span><span><span class="sw" style="background:#888;opacity:.85"></span>intoxication</span>` +
  `<span><span class="sw" style="background:#888"></span>rechute</span><span><span class="sw" style="background:#888;opacity:.45;border:1px dashed #888"></span>date approximative</span>` +
  `<span style="color:#e11d48">⚡ perte de contrôle</span><span>◆ événement sans durée</span><span>▶ en cours</span>`;
document.getElementById("main").addEventListener("wheel", (ev) => {
  if (!ev.ctrlKey && !ev.shiftKey) return;
  ev.preventDefault();
  const r = ev.currentTarget.getBoundingClientRect(), W = r.width, f = (ev.clientX - r.left - LABEL_W) / (W - LABEL_W - PADR);
  const c = view[0] + Math.min(Math.max(f, 0), 1) * (view[1] - view[0]), k = ev.deltaY > 0 ? 1.25 : .8;
  setView(c - (c - view[0]) * k, c + (view[1] - c) * k);
}, {passive: false});
addEventListener("resize", redraw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
if (innerWidth < 600) view = [Math.max(DOM_MIN, REF - 5 * 365.25 * DAY), DOM_MAX];
redraw();
</script>
</body>
</html>
