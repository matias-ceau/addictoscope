le décès de son mari en 2019. Pas d'alcool.\n\nLe 12/01/2024, chute nocturne à domicile avec fracture du col du fémur droit, prothèse totale de hanche le 13/01. Le 17/01, crise convulsive généralisée dans le service d'orthopédie, attribuée à l'arrêt brutal des benzodiazépines à l'admission. Rééducation en SSR jusqu'au 09/02.\n\nJe lui ai represcrit son traitement habituel à la sortie. Elle est très anxieuse depuis toujours et redoute l'arrêt, mais elle a été marquée par la crise et accepte d'en parler.\n\nJe vous remercie de la recevoir et reste à votre disposition.\n\nBien confraternellement,\n\nDr T. [identité]"}, "historique:o1": {"label": "historique · psychiatrique de suivi", "date": "2024-02-20", "text": "Observations :\nVue ce jour en premier entretien, adressée par son MG (courrier du 08/02), accompagnée de sa fille [identité].\nMme [identité], 65 ans, secrétaire scolaire retraitée, veuve depuis 2019. Vit seule.\nChute la nuit du 12/01 en se levant aux toilettes \"après le Stilnox\", fracture du col du fémur, PTH, puis crise convulsive à J4 à l'hôpital (BZD non poursuivies à l'admission). Rééducation en SSR. Marche avec une canne.\nBenzodiazépines : alprazolam \"depuis la mort de mon mari\" selon elle (depuis bien avant selon sa fille), dose réelle 3 mg/j : complète les ordonnances du MG par celles d'un second médecin \"quand j'en manque\". Zolpidem 10 mg chaque soir, parfois 15.\nAlcool : 2 verres de vin au diner + un porto \"pour dormir\".\nAnxiété généralisée ancienne (inquiétudes incontrolables pour sa fille et ses petits-enfants, tensions musculaires, insomnie) depuis la quarantaine environ.\nThymie neutre, pas d'idées suicidaires. MMSE non fait, orientée, pas de plainte mnésique.\nConclusions :\n- Explications sur le sevrage progressif (pas d'arret brutal ++), accord de principe\n- Relais alprazolam par diazépam au prochain RDV\n- Alcool : à diminuer, pas d'alcool avec le zolpidem\n- RDV 15 jours"}, "historique:o2": {"label": "historique · psychiatrique de suivi", "date": "2024-03-05", "text": "Observations :\nVue ce jour\nArrêt du second prescripteur, a accepté que je sois seule prescriptrice des BZD avec son MG informé.\nRelais : arret alprazolam, diazépam 10 mg x 3 (équivalence approximative), à reévaluer selon la somnolence.\nZolpidem 10 mg poursuivi pour l'instant, une seule molécule modifiée a la fois.\nConclusions :\nOrdonnance sécurisée, délivrance hebdomadaire pharmacie habituelle\nPassage IDE dans 3 semaines\nRDV 1 mois"}, "historique:o3": {"label": "historique · entretien infirmier", "date": "2024-03-26", "text": "Entretien IDE. Bonne tolérance du diazépam, un peu de somnolence l'après-midi les premiers jours. Pas de chute. Pilulier mis en place avec sa fille.\nContacts : domicile [identité], 33610 CESTAS, tél. [identité] ; sa fille Mme [identité] [identité] [identité].\nTabac : ne fume pas."}, "historique:o4": {"label": "historique · psychiatrique de suivi", "date": "2024-04-23", "text": "Observations :\nVue ce jour\nDiazépam diminué à 25 mg/j (10-5-10) depuis le 10/04, bien toléré. Anxiété \"supportable\", ruminations le soir.\nAlcool : 1 verre au diner.\nPour le TAG, intéret d'un traitement de fond : accepte la sertraline.\nConclusions :\nSertraline 25 mg pendant 1 semaine puis 50 mg\nDiazépam 25 mg\nRDV 6 semaines"}, "historique:o5": {"label": "historique · psychiatrique de suivi", "date": "2024-06-11", "text": "Observations :\nVue ce jour\nDiazépam 20 mg/j depuis fin mai. Sertraline 50 mg : moins d'inquiétudes \"pour tout\", meilleur sommeil.\nZolpidem : passe à un demi-comprimé de 10 mg, de elle-meme certains soirs.\nConclusions :\nSchéma de diminution : - 2,5 mg toutes les 3 semaines si bien toléré\nRDV septembre (va chez sa fille en aout)"}, "historique:o6": {"label": "historique · psychiatrique de suivi", "date": "2024-09-10", "text": "Observations :\nVue ce jour\nDiminution mise en pause en aout chez sa fille (\"je n'ai rien touché pendant les vacances\"), donc toujours à 20 mg. En réalité, d'après le pilulier, est descendue à 17,5 mg mi-juillet. Diazépam à 15 mg/j depuis le 02/09.\nAnxiété majorée à l'approche de l'anniversaire du décès de son mari (septembre).\nConclusions :\nDiazépam 15 mg/j, maintien 1 mois\nRDV octobre-novembre"}, "historique:o7": {"label": "historique · psychiatrique de suivi", "date": "2024-11-05", "text": "Observations :\nEntretien téléphonique :\nSa soeur ainée hospitalisée (AVC). Anxiété ++, insomnie. Demande à reprendre \"son Xanax, juste le temps que ça passe\". Refus expliqué, réassurance.\nPas d'alcool supplémentaire selon elle.\nConclusions :\nMaintien diazépam 15 mg, pas de nouvelle diminution ce mois-ci\nRDV présentiel décembre"}, "historique:o8": {"label": "historique · infirmière", "date": "2024-12-17", "text": "Appel de sa fille : a trouvé chez sa mère une boite d'alprazolam 0,5 mg entamée, prescrite par un médecin remplaçant fin novembre. Mme [identité] reconnait au téléphone \"deux ou trois comprimés les soirs d'angoisse\".\nInfo transmise au Dr [identité], RDV avancé."}, "historique:o9": {"label": "historique · psychiatrique de suivi", "date": "2025-01-14", "text": "Observations :\nVue ce jour avec sa fille\nReprise d'alprazolam en novembre-décembre, une dizaine de comprimés au total, honte ++. Pas d'arret brutal du diazépam.\nContrat de soins rediscuté : un seul prescripteur (moi), une seule pharmacie, MG d'accord. Soeur sortie de l'hopital, en rééducation.\nZolpidem arreté depuis le 01/01 \"pour la nouvelle année\", sommeil haché mais tolérable.\nConclusions :\nDiazépam 12 mg/j (comprimés de 2 mg), puis -2 mg toutes les 3 semaines\nHygiène du sommeil, orientation TCC de l'insomnie / de l'anxiété (Mme [identité])\nRDV 2 mois"}, "historique:o10": {"label": "historique · psychiatrique de suivi", "date": "2025-03-18", "text": "Observations :\nVue ce jour\nA déménagé le 01/03 dans un appartement en rez-de-chaussée près de chez sa fille. Contente, \"plus d'escaliers\".\nDiazépam 8 mg/j. Plus d'alprazolam. Commence la TCC.\nThymie neutre, anxiété modérée.\nConclusions :\nPoursuite de la décroissance\nRDV mai"}, "historique:o11": {"label": "historique · psychologique", "date": "2025-06-03", "text": "4e séance de TCC. [identité] tient son agenda des inquiétudes, repère qu'elles portent surtout sur la santé de ses proches. Exercices de report de l'inquiétude à un \"temps dédié\" en fin d'après-midi : plutôt efficaces.\nRestriction du temps au lit en cours pour l'insomnie, endormissement amélioré.\nElle dit ne plus penser au Xanax \"que le soir des mauvaises nouvelles\"."}, "historique:o12": {"label": "historique · psychiatrique de suivi", "date": "2025-07-08", "text": "Observations :\nVue ce jour\nDiazépam 4 mg/j, tolérance correcte, un peu d'irritabilité les jours de baisse. Sertraline 50 mg poursuivie.\nAlcool : un verre de temps en temps le week-end.\nInquiétudes moins envahissantes, profite de ses petits-enfants.\nConclusions :\nDiazépam 2 mg/j a partir du 01/08 puis arret fin septembre si toléré\nRDV octobre"}, "historique:o13": {"label": "historique · psychiatrique de suivi", "date": "2025-10-21", "text": "Observations :\nVue ce jour\nDiazépam arreté le 30/09. Quelques nuits d'insomnie de rebond la 1ère semaine, rentré dans l'ordre. Pas de reprise d'alprazolam ni de zolpidem.\nFière, \"je n'y croyais pas\". Anxiété contenue avec les outils de la TCC.\nConclusions :\nSertraline 50 mg à poursuivre au moins 6 mois\nRDV 3 mois, fin de suivi envisageable ensuite"}}, "ref": "2025-10-01", "kinds": [{"id": "life_event", "label": "Événements de vie", "light": "#b45309", "dark": "#f59e0b"}, {"id": "substance_use", "label": "Consommations", "light": "#c62828", "dark": "#ef6b6b"}, {"id": "psychiatric", "label": "Psychopathologie", "light": "#6a4bb0", "dark": "#a78bfa"}, {"id": "somatic", "label": "Somatique", "light": "#0f7b6c", "dark": "#34d3b9"}, {"id": "medication", "label": "Médicaments", "light": "#1d5fb4", "dark": "#6aa6f0"}, {"id": "therapeutic_psycho", "label": "Prises en charge", "light": "#4d7c0f", "dark": "#a3d95b"}], "modeLabel": {"usage": "usage", "intoxication": "intoxication", "sevrage": "sevrage", "rechute": "rechute", "craving": "craving"}, "certaintyLabel": {"exact": "date exacte", "month": "mois", "year": "année", "approx": "date approximative"}};
const NS = "http://www.w3.org/2000/svg";
const dark = () => matchMedia("(prefers-color-scheme: dark)").matches;
const DAY = 864e5;
const t = (iso) => Date.parse(iso + "T00:00:00Z");
const REF = t(D.ref);
const kindOf = Object.fromEntries(D.kinds.map(k => [k.id, k]));
const trackOf = Object.fromEntries(D.tracks.map(x => [x.id, x]));
const color = (kind) => kindOf[kind][dark() ? "dark" : "light"];
const MODE_OP = {usage:.55, craving:.7, sevrage:.7, intoxication:.85, rechute:1};
const EVENTS = D.events.map((e, i) => ({
  ...e, i, kind: trackOf[e.track].kind, label: trackOf[e.track].label,
  a: t(e.s), b: e.e ? t(e.e) : (e.ongoing ? REF : t(e.s)),
}));
const hidden = new Set();
let LABEL_W = 150; const ROW = 26, PADR = 14, AXIS = 84;
let DOM_MIN = Math.min(...EVENTS.map(e => e.a)) - 200*DAY, DOM_MAX = REF + 60*DAY;
let view = [DOM_MIN, DOM_MAX];

const el = (name, attrs = {}, parent, text) => {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
};
const fmt = (s) => { if (!s) return ""; const [y,m,d] = s.split("-"); return d ? `${d}/${m}/${y}` : m ? `${m}/${y}` : y; };
const yr = (ms) => new Date(ms).getUTCFullYear();

function ticks(a, b) {
  const span = (b - a) / (365.25*DAY), out = [];
  const step = span > 40 ? 10 : span > 18 ? 5 : span > 9 ? 2 : span > 3.5 ? 1 : 0;
  if (step) { for (let y = Math.ceil(yr(a)/step)*step; Date.UTC(y,0,1) <= b; y += step) out.push([Date.UTC(y,0,1), String(y), true]); }
  else {
    const q = span > 1.6 ? 3 : 1;
    for (let y = yr(a); y <= yr(b); y++) for (let m = 0; m < 12; m += q) {
      const v = Date.UTC(y, m, 1); if (v < a || v > b) continue;
      out.push([v, m === 0 ? String(y) : `${String(m+1).padStart(2,"0")}/${String(y).slice(2)}`, m === 0]);
    }
  }
  return out;
}

const bolt = (x, y, s=7) => `M${x} ${y-s} L${x-s*.55} ${y+.1} L${x-.05*s} ${y+.1} L${x-s*.35} ${y+s} L${x+s*.6} ${y-.25*s} L${x+.05*s} ${y-.25*s} Z`;

function drawMain() {
  const svg = document.getElementById("main");
  svg.replaceChildren();
  const W = svg.clientWidth || 800;
  LABEL_W = W < 600 ? 92 : 150;
  const innerW = W - LABEL_W - PADR;
  const x = (ms) => LABEL_W + (ms - view[0]) / (view[1] - view[0]) * innerW;
  const kinds = D.kinds.filter(k => !hidden.has(k.id));
  const rows = [];
  for (const k of kinds) if (k.id !== "life_event") {
    rows.push({head: k});
    for (const tr of D.tracks.filter(tr => tr.kind === k.id)) rows.push({track: tr});
  }
  const showLife = !hidden.has("life_event");
  const H = AXIS + 18 + rows.length * ROW + 24;
  svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const defs = el("defs", {}, svg);
  const cp = el("clipPath", {id: "clip"}, defs); el("rect", {x: LABEL_W, y: 0, width: innerW, height: H}, cp);
  // grid + axis
  const gridG = el("g", {}, svg);
  for (const [v, lab, major] of ticks(...view)) {
    const xx = x(v);
    el("line", {x1: xx, x2: xx, y1: AXIS - 4, y2: H - 20, stroke: "var(--line)", "stroke-width": major ? 1 : .5}, gridG);
    el("text", {x: xx + 3, y: H - 7, class: "mute"}, gridG, lab);
  }
  el("line", {x1: LABEL_W, x2: W - PADR, y1: AXIS - 4, y2: AXIS - 4, stroke: "var(--axis)", "stroke-width": 4, "stroke-linecap": "round"}, svg);
  const g = el("g", {"clip-path": "url(#clip)"}, svg);
  // life events on the axis
  if (showLife) {
    const life = EVENTS.filter(e => e.kind === "life_event" && e.b >= view[0] && e.a <= view[1]);
    const lanes = [[], [], [], [], []];
    for (const e of life.sort((p, q) => p.a - q.a)) {
      const pt = e.point || (e.b - e.a) < 120*DAY;
      const xa = x(Math.max(e.a, view[0])), xb = pt ? xa : x(Math.min(e.b, view[1]));
      const w = e.label.length * 5.9 + 10, flip = xa + w > W - PADR;
      const iv = flip ? [xa - w, xa + 4] : [xa - 4, xa + w];
      let ln = lanes.findIndex(l => l.every(o => o[1] < iv[0] || o[0] > iv[1]));
      if (ln < 0) ln = lanes.length - 1;
      lanes[ln].push(iv);
      const ty = AXIS - 14 - ln * 13 - 4;
      const grp = el("g", {class: "ev", "data-i": e.i}, g);
      if (!pt) el("rect", {x: xa, y: AXIS - 8, width: Math.max(2, xb - xa), height: 8, rx: 3, fill: color("life_event"), opacity: .85}, grp);
      else el("path", {d: `M${xa} ${AXIS-11} l6 6 l-6 6 l-6 -6 Z`, fill: color("life_event")}, grp);
      el("line", {x1: xa, x2: xa, y1: ty + 3, y2: AXIS - 11, stroke: color("life_event"), "stroke-width": 1, opacity: .6}, grp);
      el("text", {x: flip ? xa - 3 : xa + 3, y: ty, "font-size": 11, "text-anchor": flip ? "end" : "start", "pointer-events": "none"}, grp, e.label);
      if (e.loss) el("path", {d: bolt(xa, AXIS + 6, 6), fill: "#e11d48"}, grp);
    }
  }
  // rows
  let y = AXIS + 6;
  for (const r of rows) {
    if (r.head) {
      el("text", {x: 6, y: y + 17, "font-weight": 600, fill: color(r.head.id)}, svg, r.head.label.toUpperCase()).setAttribute("font-size", 11);
      el("line", {x1: 6, x2: W - PADR, y1: y + ROW - 3, y2: y + ROW - 3, stroke: color(r.head.id), opacity: .35}, svg);
    } else {
      const cut = W < 600 ? 13 : 24;
      const lab = r.track.label.length > cut ? r.track.label.slice(0, cut - 1) + "…" : r.track.label;
      el("text", {x: 12, y: y + 17, class: "mute"}, svg, lab).appendChild(Object.assign(document.createElementNS(NS, "title"), {textContent: r.track.label}));
      for (const e of EVENTS.filter(e => e.track === r.track.id)) {
        if (e.b < view[0] || e.a > view[1]) continue;
        const grp = el("g", {class: "ev", "data-i": e.i}, g);
        const c = color(e.kind), op = e.mode ? (MODE_OP[e.mode] ?? .6) : .8;
        const xa = x(e.a), xb = x(e.b);
        const dash = e.certainty === "approx" ? "4 3" : null;
        if (e.point || xb - xa < 5) {
          el("path", {d: `M${xa} ${y+5} l7 7 l-7 7 l-7 -7 Z`, fill: c, opacity: op}, grp);
        } else {
          const rc = el("rect", {x: xa, y: y + 4, width: xb - xa, height: ROW - 10, rx: 4, fill: c, opacity: op}, grp);
          if (dash) { rc.setAttribute("stroke", c); rc.setAttribute("stroke-dasharray", dash); rc.setAttribute("fill-opacity", .45); }
          if (e.ongoing && xb < W) el("path", {d: `M${xb} ${y+4} l8 ${(ROW-10)/2} l-8 ${(ROW-10)/2} Z`, fill: c, opacity: op}, grp);
        }
        if (e.loss) el("path", {d: bolt(xa, y + ROW/2 - 1), fill: "#e11d48", stroke: "var(--panel)", "stroke-width": .8}, grp);
        if (e.mode && e.mode !== "usage" && xb - xa > 56) el("text", {x: xa + 6, y: y + 17, fill: "#fff", "font-size": 10.5, "pointer-events": "none"}, grp, MODE_LABEL(e.mode)).setAttribute("style", "fill:#fff");
      }
    }
    y += ROW;
  }
  svg.querySelectorAll(".ev").forEach(n => {
    const go = () => select(+n.dataset.i);
    n.addEventListener("click", go); n.addEventListener("pointerenter", (ev) => { if (ev.pointerType === "mouse") go(); });
  });
  if (selected !== null) svg.querySelector(`.ev[data-i="${selected}"]`)?.classList.add("sel");
}
const MODE_LABEL = (m) => D.modeLabel[m] || m;

let selected = null;
function obsHtml(v, esc) {
  const o = D.obs[v.id];
  let html = "", at = 0;
  for (const [a, b] of v.marks) { html += esc(o.text.slice(at, a)) + "<mark>" + esc(o.text.slice(a, b)) + "</mark>"; at = b; }
  html += esc(o.text.slice(at));
  return `<div class="obs"><div class="oh">${o.date ? esc(o.date) + " · " : ""}${esc(o.label)}${o.summary_only ? " · résumé" : ""}</div><div class="ot">${html}</div></div>`;
}
function select(i) {
  selected = i;
  document.querySelectorAll(".ev").forEach(n => n.classList.toggle("sel", +n.dataset.i === i));
  const e = EVENTS[i];
  const when = e.endLabel ? (e.startLabel === e.endLabel ? fmt(e.startLabel) : `${fmt(e.startLabel)} → ${fmt(e.endLabel)}`)
    : e.ongoing ? `depuis ${fmt(e.startLabel)} (en cours)` : fmt(e.startLabel);
  const esc = (s) => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const bits = [];
  if (e.mode) bits.push(MODE_LABEL(e.mode));
  if (e.certainty) bits.push(D.certaintyLabel[e.certainty] || e.certainty);
  if (e.loss) bits.push("⚡ perte de contrôle");
  document.getElementById("detail").innerHTML =
    `<b>${esc(e.label)}</b> <span class="k">· ${esc(kindOf[e.kind].label)} · ${when}${bits.length ? " · " + esc(bits.join(" · ")) : ""}</span>` +
    (e.note ? `<div>${esc(e.note)}</div>` : "") +
    (e.sources.length ? `<div class="k">Autres sources : ${e.sources.map(esc).join(" ; ")}</div>` : "") +
    (e.evidence.length ? `<div class="k" style="margin-top:8px">${e.evidence.length > 1 ? "Observations" : "Observation"} d'origine${e.evidence.some(v => !v.marks.length) ? " (passage justificatif non repéré dans certaines)" : ", passage justificatif surligné"} :</div><div id="obs">` +
      e.evidence.map(v => obsHtml(v, esc)).join("") + `</div>` : "");
  document.querySelector("#obs mark")?.scrollIntoView({block: "nearest"});
}

// overview strip with a draggable window
function drawOverview() {
  const svg = document.getElementById("ov");
  svg.replaceChildren();
  const W = svg.clientWidth || 800, H = 54, L = 12, R = 12, innerW = W - L - R;
  const x = (ms) => L + (ms - DOM_MIN) / (DOM_MAX - DOM_MIN) * innerW;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  for (const [v, lab, major] of ticks(DOM_MIN, DOM_MAX)) {
    if (!major) continue;
    el("line", {x1: x(v), x2: x(v), y1: 4, y2: H - 14, stroke: "var(--line)"}, svg);
    el("text", {x: x(v) + 2, y: H - 3, class: "mute", "font-size": 10}, svg, lab);
  }
  const vis = EVENTS.filter(e => !hidden.has(e.kind));
  const n = Math.max(1, new Set(vis.map(e => e.track)).size), tracks = [...new Set(vis.map(e => e.track))];
  for (const e of vis) {
    const r = tracks.indexOf(e.track), yy = 6 + r * (H - 24) / n;
    el("rect", {x: x(e.a), y: yy, width: Math.max(2, x(e.b) - x(e.a)), height: Math.max(1.5, (H - 24) / n - 1), fill: color(e.kind), opacity: .7}, svg);
  }
  const win = el("rect", {x: x(view[0]), y: 1, width: Math.max(10, x(view[1]) - x(view[0])), height: H - 14, rx: 5, fill: "rgba(80,120,220,.16)", stroke: "#4f7be0", "stroke-width": 1.5, style: "cursor:grab"}, svg);
  const hl = el("rect", {x: x(view[0]) - 5, y: 1, width: 10, height: H - 14, fill: "#4f7be0", opacity: .01, style: "cursor:ew-resize"}, svg);
  const hr = el("rect", {x: x(view[1]) - 5, y: 1, width: 10, height: H - 14, fill: "#4f7be0", opacity: .01, style: "cursor:ew-resize"}, svg);
  const inv = (px) => DOM_MIN + (px - L) / innerW * (DOM_MAX - DOM_MIN);
  const MINSPAN = 120 * DAY;
  const drag = (node, kind) => node.addEventListener("pointerdown", (ev) => {
    ev.preventDefault(); node.setPointerCapture(ev.pointerId);
    const x0 = ev.clientX, v0 = [...view], per = (DOM_MAX - DOM_MIN) / innerW;
    const move = (m) => {
      const d = (m.clientX - x0) * per;
      let [a, b] = v0;
      if (kind === "move") { const span = b - a; a = Math.min(Math.max(DOM_MIN, a + d), DOM_MAX - span); b = a + span; }
      else if (kind === "l") a = Math.min(Math.max(DOM_MIN, a + d), b - MINSPAN);
      else b = Math.max(Math.min(DOM_MAX, b + d), a + MINSPAN);
      view = [a, b]; drawOverview(); drawMain();
    };
    const up = () => { node.removeEventListener("pointermove", move); node.removeEventListener("pointerup", up); };
    node.addEventListener("pointermove", move); node.addEventListener("pointerup", up);
  });
  drag(win, "move"); drag(hl, "l"); drag(hr, "r");
}

function setView(a, b) { view = [Math.max(DOM_MIN, a), Math.min(DOM_MAX, b)]; redraw(); }
function redraw() { drawOverview(); drawMain(); }

// controls
const kindsBar = document.getElementById("kinds");
for (const k of D.kinds) {
  const b = document.createElement("button"); b.className = "chip"; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<i style="background:${k[dark() ? "dark" : "light"]}"></i>${k.label}`;
  b.onclick = () => { hidden.has(k.id) ? hidden.delete(k.id) : hidden.add(k.id); b.setAttribute("aria-pressed", String(!hidden.has(k.id))); redraw(); };
  kindsBar.appendChild(b);
}
const presets = document.getElementById("presets");
const addPreset = (label, fn) => { const b = document.createElement("button"); b.textContent = label; b.onclick = fn; presets.appendChild(b); };
addPreset("Tout", () => setView(DOM_MIN, DOM_MAX));
for (const yrs of [10, 5, 2]) addPreset(`${yrs} dernières années`, () => setView(REF - yrs * 365.25 * DAY, DOM_MAX));
addPreset("−", () => { const c = (view[0] + view[1]) / 2, h = (view[1] - view[0]); setView(c - h, c + h); });
addPreset("+", () => { const c = (view[0] + view[1]) / 2, h = (view[1] - view[0]) / 4; setView(c - h, c + h); });
document.getElementById("legend").innerHTML =
  `<span><span class="sw" style="background:#888;opacity:.55"></span>usage</span><span><span class="sw" style="background:#888;opacity:.85"></span>intoxication</span>` +
  `<span><span class="sw" style="background:#888"></span>rechute</span><span><span class="sw" style="background:#888;opacity:.45;border:1px dashed #888"></span>date approximative</span>` +
  `<span style="color:#e11d48">⚡ perte de contrôle</span><span>◆ événement sans durée</span><span>▶ en cours</span>`;
document.getElementById("main").addEventListener("wheel", (ev) => {
  if (!ev.ctrlKey && !ev.shiftKey) return;
  ev.preventDefault();
  const r = ev.currentTarget.getBoundingClientRect(), W = r.width, f = (ev.clientX - r.left - LABEL_W) / (W - LABEL_W - PADR);
  const c = view[0] + Math.min(Math.max(f, 0), 1) * (view[1] - view[0]), k = ev.deltaY > 0 ? 1.25 : .8;
  setView(c - (c - view[0]) * k, c + (view[1] - c) * k);
}, {passive: false});
addEventListener("resize", redraw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
if (innerWidth < 600) view = [Math.max(DOM_MIN, REF - 5 * 365.25 * DAY), DOM_MAX];
redraw();
</script>
</body>
</html>
