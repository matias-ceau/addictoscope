ageNote": null, "note": "En réanimation (hépatologie), défaillance multiviscérale sur décompensation de cirrhose après nouvelle hémorragie digestive. Dossier clôturé.", "sources": ["historique 2025-01-21"], "evidence": [{"id": "historique:o1", "marks": [[89, 257]]}], "s": "2025-01-14", "e": null, "point": true, "startLabel": "2025-01-14", "endLabel": null}], "undated": [], "obs": {"historique:o1": {"label": "historique · Observation psychiatrique de suivi", "date": "2025-01-21", "text": "Observations :\nAppel de son épouse ce jour au secrétariat puis entretien téléphonique.\nM. [identité] est décédé le 14/01/2025 en réanimation (hépatologie), défaillance multiviscérale sur décompensation de sa cirrhose apres une nouvelle hémorragie digestive.\nMme [identité] remercie l'équipe. Épuisée, culpabilité (\"j'aurais du le forcer à rester abstinent\"). Soutien, déculpabilisation.\nConclusions :\nProposition d'entretien pour l'épouse (groupe entourage / psychologue), coordonnées données\nInformation de l'équipe et du MG (Dr [identité])\nCloture du dossier"}, "historique:o2": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-12-10", "text": "Observations :\nEntretien téléphonique avec son épouse (RDV du jour non honoré).\nHospitalisé en hépatologie depuis le 02/12 : ictère, ascite, confusion (encéphalopathie hépatique). Pas d'alcool depuis fin aout selon elle.\nPronostic réservé selon l'équipe d'hépato.\nConclusions :\nRappeler la semaine prochaine\nLien avec l'ELSA du service"}, "historique:o3": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-10-15", "text": "Observations :\nVu ce jour avec son épouse.\nAbstinent depuis le 25/08 (EthG négatif début octobre). Thymie abaissée depuis la suspension de l'inscription, découragement, \"à quoi ça sert\". Pas d'idées suicidaires. Appétit faible.\nAscite récidivante, ponction prévue la semaine prochaine. Fatigue ++.\nTabac 15 cig/j malgré les patchs.\nConclusions :\nMirtazapine 30 mg\nBaclofène 45 mg/j inchangé\nRDV 1 mois, plus tôt si besoin"}, "historique:o4": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-09-03", "text": "Observations :\nVu ce jour, avec sa fille [identité].\nReprise de l'alcool pendant ses vacances chez sa fille : \"deux semaines en aout\", rosé 2 a 3 verres par jour, arret le 25/08 de lui-meme. Sa fille, présente, situe la reprise \"depuis juillet, tous les jours un peu\".\nRésultat EthG positif transmis par l'hépatologue : inscription sur liste de greffe suspendue (RCP du 29/08). Grosse déception, colère contre lui-meme.\nPas de signe de sevrage actuellement (arret il y a plus d'une semaine).\nConclusions :\nReprise du suivi rapproché, RDV dans 15 jours\nContact Dr [identité] pour réévaluation de l'inscription a 6 mois"}, "historique:o5": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-06-25", "text": "Observations :\nVu ce jour\nAbstinent depuis le 20/11 (7 mois). Craving en hausse a l'approche de l'anniversaire de la mort de son frère, envies \"de trinquer pour lui\", n'a pas bu.\nRCP de greffe du 18/06 : accord pour inscription sur liste. Fier, se projette.\nConclusions :\nRO baclofène 45 mg/j + mirtazapine 15 mg\nRDV juillet"}, "historique:o6": {"label": "historique · Entretien infirmier", "date": "2024-05-14", "text": "Entretien IDE avec M. [identité] + prélèvement urinaire : EthG négatif. TA 128/76. Poids 82 kg (stable).\nTabac diminué à 12 cig/j avec patch 21 mg. Pas de craving déclaré.\nContact de son épouse à jour : [identité]."}, "historique:o7": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-03-05", "text": "Observations :\nVu ce jour\nToujours abstinent. Thymie meilleure, reprend le jardin, voit sa fille et ses petits-enfants plus souvent.\nBilan pré-greffe en cours (consultations anesthésie, cardio). Explications sur le contrat d'abstinence.\nConclusions :\nPoursuite baclofène 45 mg/j, mirtazapine 15 mg\nRDV 3 mois"}, "historique:o8": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-01-09", "text": "Observations :\nVu ce jour en entretien :\nAbstinent depuis l'hémorragie digestive (20/11). \"J'ai eu peur de mourir\". Pas de craving majeur, quelques envies le soir devant la télé.\nAbord de la greffe hépatique avec le Dr [identité] : nécessite une abstinence durable et un suivi addicto régulier, motivé ++.\nTabac : 20 cig/j, souhaite réduire, accepte les substituts.\nConclusions :\n- Patch 21 mg + pastilles 2 mg\n- Baclofène 45 mg/j\n- RDV 2 mois"}, "historique:o9": {"label": "historique · Observation somatique de suivi", "date": "2023-11-28", "text": "Observations :\nEchanges de mails avec le Dr [identité] (hépatologue), avec l'accord du patient :\nHospitalisation du 20 au 24/11 pour hémorragie digestive sur rupture de varices oesophagiennes, ligature en urgence, transfusion 2 culots. Pas de sevrage compliqué pendant l'hospitalisation (oxazépam).\nPas d'alcool depuis le 20/11.\nConclusions :\nRDV avancé début janvier"}, "historique:o10": {"label": "historique · Observation psychiatrique de suivi", "date": "2023-10-17", "text": "Observations :\nVu ce jour\nConsommation actuelle autour d'1 L de vin par jour, plus de pastis. Refuse un nouveau sevrage hospitalier pour l'instant (\"pas maintenant, après les fêtes\"). Objectif de réduction négocié : 4 verres par jour maximum, agenda de consommation.\nAscite : ponction évacuatrice le 09/10 en hépato.\nRappel : sevrage ambulatoire non indiqué au vu des ATCD (crise convulsive, cirrhose).\nConclusions :\nBaclofène majoré à 60 mg/j (20 x 3)\nRDV 1 mois"}, "historique:o11": {"label": "historique · Entretien social", "date": "2023-09-05", "text": "M. [identité] [identité], né le [identité], N° SS [identité], demeurant [identité], 33450 IZON.\nAncien chauffeur poids lourd, licencié en 2015, en invalidité catégorie 2 depuis 2022. Son épouse [identité] travaille à mi-temps.\nMme [identité] exprime son épuisement, \"parle de partir\" si les consommations continuent.\nDémarches : aide-ménagère via la caisse de retraite, dossier APA non éligible (âge), information sur les groupes d'entraide pour l'entourage."}, "historique:o12": {"label": "historique · Observation psychiatrique de suivi", "date": "2023-07-18", "text": "Observations :\nVu ce jour\nRechute franche depuis les obsèques de son frère, vin 1 a 1,5 L/j. Tremblements le matin, soulagés par la première prise.\nDeuil difficile : tristesse, pleurs, insomnie d'endormissement, perte d'appétit, culpabilité de ne pas avoir été plus présent. Pas d'idées suicidaires.\nNe souhaite pas re-hospitalisation dans l'immédiat.\nConclusions :\nIntroduction mirtazapine 15 mg le soir (sommeil, appétit), surveillance hépatique\nBaclofène 45 mg/j maintenu\nThiamine poursuivie"}, "historique:o13": {"label": "historique · Observation psychiatrique de suivi", "date": "2023-07-04", "text": "Observations :\nEntretien téléphonique :\nSon frère [identité] est décédé le 26/06 (cancer du pancréas). A bu \"quelques verres\" le jour des obsèques et depuis, n'arrive pas à s'arreter, ne quantifie pas.\nCraving ++. Accepte un RDV présentiel rapide.\nConclusions :\nRDV le 18/07"}, "historique:o14": {"label": "historique · Observation psychiatrique de suivi", "date": "2023-05-30", "text": "Observations :\nVu ce jour\nAbstinent depuis la sortie (2 mois). Fatigue, mais \"l'esprit plus clair\". Baclofène 30 mg/j bien toléré, pas de somnolence.\nPréoccupé par l'état de santé de son frère, hospitalisé en soins palliatifs.\nConclusions :\nBaclofène 15 mg x 3 = 45 mg/j\nRDV 1 mois"}, "historique:o15": {"label": "historique · Observation psychiatrique de suivi", "date": "2023-04-11", "text": "Observations :\nVu ce jour, sorti le 07/04 de l'unité d'addictologie apres un sevrage du 27/03 au 07/04 sous oxazépam + vitamines B1 B6, sans complication.\nAbstinent, satisfait, se sent \"léger\". Quelques troubles du sommeil.\nProjet : maintien de l'abstinence (cirrhose). Discussion sur les ent", "label": "Événements de vie", "light": "#b45309", "dark": "#f59e0b"}, {"id": "substance_use", "label": "Consommations", "light": "#c62828", "dark": "#ef6b6b"}, {"id": "psychiatric", "label": "Psychopathologie", "light": "#6a4bb0", "dark": "#a78bfa"}, {"id": "somatic", "label": "Somatique", "light": "#0f7b6c", "dark": "#34d3b9"}, {"id": "medication", "label": "Médicaments", "light": "#1d5fb4", "dark": "#6aa6f0"}, {"id": "therapeutic_psycho", "label": "Prises en charge", "light": "#4d7c0f", "dark": "#a3d95b"}], "modeLabel": {"usage": "usage", "intoxication": "intoxication", "sevrage": "sevrage", "rechute": "rechute", "craving": "craving"}, "certaintyLabel": {"exact": "date exacte", "month": "mois", "year": "année", "approx": "date approximative"}};
const NS = "http://www.w3.org/2000/svg";

const REF = t(D.ref);

let LABEL_W = 150; const ROW = 26, PADR = 14, AXIS = 84;
let DOM_MIN = Math.min(...EVENTS.map(e => e.a)) - 200*DAY, DOM_MAX = REF + 60*DAY;

};
const fmt = (s) => { if (!s) return ""; const [y,m,d] = s.split("-"); return d ? `${d}/${m}/${y}` : m ? `${m}/${y}` : y; };
const yr = (ms) => new Date(ms).getUTCFullYear();

function ticks(a, b) {
  const span = (b - a) / (365.25*DAY), out = [];
  const step = span > 40 ? 10 : span > 18 ? 5 : span > 9 ? 2 : span > 3.5 ? 1 : 0;
  if (step) { for (let y = Math.ceil(yr(a)/step)*step; Date.UTC(y,0,1) <= b; y += step) out.push([Date.UTC(y,0,1), String(y), true]); }
  else {
    const q = span > 1.6 ? 3 : 1;
    for (let y = yr(a); y <= yr(b); y++) for (let m = 0; m < 12; m += q) {

      out.push([v, m === 0 ? String(y) : `${String(m+1).padStart(2,"0")}/${String(y).slice(2)}`, m === 0]);
    }

}

const bolt = (x, y, s=7) => `M${x} ${y-s} L${x-s*.55} ${y+.1} L${x-.05*s} ${y+.1} L${x-s*.35} ${y+s} L${x+s*.6} ${y-.25*s} L${x+.05*s} ${y-.25*s} Z`;

  // grid + axis
  const gridG = el("g", {}, svg);
  for (const [v, lab, major] of ticks(...view)) {
    const xx = x(v);
    el("line", {x1: xx, x2: xx, y1: AXIS - 4, y2: H - 20, stroke: "var(--line)", "stroke-width": major ? 1 : .5}, gridG);
    el("text", {x: xx + 3, y: H - 7, class: "mute"}, gridG, lab);
  }
  el("line", {x1: LABEL_W, x2: W - PADR, y1: AXIS - 4, y2: AXIS - 4, stroke: "var(--axis)", "stroke-width": 4, "stroke-linecap": "round"}, svg);
  const g = el("g", {"clip-path": "url(#clip)"}, svg);
  // life events on the axis
  if (showLife) {
    const life = EVENTS.filter(e => e.kind === "life_event" && e.b >= view[0] && e.a <= view[1]);
    const lanes = [[], [], [], [], []];
    for (const e of life.sort((p, q) => p.a - q.a)) {
      const pt = e.point || (e.b - e.a) < 120*DAY;
      const xa = x(Math.max(e.a, view[0])), xb = pt ? xa : x(Math.min(e.b, view[1]));
      const w = e.label.length * 5.9 + 10, flip = xa + w > W - PADR;
      const iv = flip ? [xa - w, xa + 4] : [xa - 4, xa + w];
      let ln = lanes.findIndex(l => l.every(o => o[1] < iv[0] || o[0] > iv[1]));
      if (ln < 0) ln = lanes.length - 1;
      lanes[ln].push(iv);
      const ty = AXIS - 14 - ln * 13 - 4;
      const grp = el("g", {class: "ev", "data-i": e.i}, g);
      if (!pt) el("rect", {x: xa, y: AXIS - 8, width: Math.max(2, xb - xa), height: 8, rx: 3, fill: color("life_event"), opacity: .85}, grp);
      else el("path", {d: `M${xa} ${AXIS-11} l6 6 l-6 6 l-6 -6 Z`, fill: color("life_event")}, grp);
      el("line", {x1: xa, x2: xa, y1: ty + 3, y2: AXIS - 11, stroke: color("life_event"), "stroke-width": 1, opacity: .6}, grp);
      el("text", {x: flip ? xa - 3 : xa + 3, y: ty, "font-size": 11, "text-anchor": flip ? "end" : "start", "pointer-events": "none"}, grp, e.label);
      if (e.loss) el("path", {d: bolt(xa, AXIS + 6, 6), fill: "#e11d48"}, grp);
    }
  }
  // rows
  let y = AXIS + 6;
  for (const r of rows) {
    if (r.head) {
      el("text", {x: 6, y: y + 17, "font-weight": 600, fill: color(r.head.id)}, svg, r.head.label.toUpperCase()).setAttribute("font-size", 11);
      el("line", {x1: 6, x2: W - PADR, y1: y + ROW - 3, y2: y + ROW - 3, stroke: color(r.head.id), opacity: .35}, svg);
    } else {
      const cut = W < 600 ? 13 : 24;
      const lab = r.track.label.length > cut ? r.track.label.slice(0, cut - 1) + "…" : r.track.label;
      el("text", {x: 12, y: y + 17, class: "mute"}, svg, lab).appendChild(Object.assign(document.createElementNS(NS, "title"), {textContent: r.track.label}));
      for (const e of EVENTS.filter(e => e.track === r.track.id)) {
        if (e.b < view[0] || e.a > view[1]) continue;
        const grp = el("g", {class: "ev", "data-i": e.i}, g);
        const c = color(e.kind), op = e.mode ? (MODE_OP[e.mode] ?? .6) : .8;
        const xa = x(e.a), xb = x(e.b);
        const dash = e.certainty === "approx" || e.ageNote ? "4 3" : null;
        if (e.point || xb - xa < 5) {
          const pt = el("path", {d: `M${xa} ${y+5} l7 7 l-7 7 l-7 -7 Z`, fill: c, opacity: op}, grp);
          if (dash) { pt.setAttribute("stroke", c); pt.setAttribute("stroke-dasharray", "2 2"); pt.setAttribute("fill-opacity", .45); }
        } else {
          const rc = el("rect", {x: xa, y: y + 4, width: xb - xa, height: ROW - 10, rx: 4, fill: c, opacity: op}, grp);
          if (dash) { rc.setAttribute("stroke", c); rc.setAttribute("stroke-dasharray", dash); rc.setAttribute("fill-opacity", .45); }
          if (e.ongoing && xb < W) el("path", {d: `M${xb} ${y+4} l8 ${(ROW-10)/2} l-8 ${(ROW-10)/2} Z`, fill: c, opacity: op}, grp);
        }
        if (e.loss) el("path", {d: bolt(xa, y + ROW/2 - 1), fill: "#e11d48", stroke: "var(--panel)", "stroke-width": .8}, grp);
        if (e.mode && e.mode !== "usage" && xb - xa > 56) el("text", {x: xa + 6, y: y + 17, fill: "#fff", "font-size": 10.5, "pointer-events": "none"}, grp, MODE_LABEL(e.mode)).setAttribute("style", "fill:#fff");
      }
    }
    y += ROW;
  }
  svg.querySelectorAll(".ev").forEach(n => {
    const go = () => select(+n.dataset.i);
    n.addEventListener("click", go); n.addEventListener("pointerenter", (ev) => { if (ev.pointerType === "mouse") go(); });
  });
  if (selected !== null) svg.querySelector(`.ev[data-i="${selected}"]`)?.classList.add("sel");
}
const MODE_LABEL = (m) => D.modeLabel[m] || m;

let selected = null;
function obsHtml(v, esc) {
  const o = D.obs[v.id];
  let html = "", at = 0;
  for (const [a, b] of v.marks) { html += esc(o.text.slice(at, a)) + "<mark>" + esc(o.text.slice(a, b)) + "</mark>"; at = b; }
  html += esc(o.text.slice(at));
  return `<div class="obs"><div class="oh">${o.date ? esc(o.date) + " · " : ""}${esc(o.label)}${o.summary_only ? " · résumé" : ""}</div><div class="ot">${html}</div></div>`;
}
function select(i) {
  selected = i;
  document.querySelectorAll(".ev").forEach(n => n.classList.toggle("sel", +n.dataset.i === i));
  const e = EVENTS[i];
  const when = e.endLabel ? (e.startLabel === e.endLabel ? fmt(e.startLabel) : `${fmt(e.startLabel)} → ${fmt(e.endLabel)}`)
    : e.ongoing ? `depuis ${fmt(e.startLabel)} (en cours)` : fmt(e.startLabel);
  const esc = (s) => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const bits = [];
  if (e.mode) bits.push(MODE_LABEL(e.mode));
  if (e.certainty) bits.push(D.certaintyLabel[e.certainty] || e.certainty);
  if (e.ageNote) bits.push(e.ageNote);
  if (e.loss) bits.push("⚡ perte de contrôle");
  document.getElementById("detail").innerHTML =
    `<b>${esc(e.label)}</b> <span class="k">· ${esc(kindOf[e.kind].label)} · ${when}${bits.length ? " · " + esc(bits.join(" · ")) : ""}</span>` +
    (e.note ? `<div>${esc(e.note)}</div>` : "") +
    (e.sources.length ? `<div class="k">Autres sources : ${e.sources.map(esc).join(" ; ")}</div>` : "") +
    (e.evidence.length ? `<div class="k" style="margin-top:8px">${e.evidence.length > 1 ? "Observations" : "Observation"} d'origine${e.evidence.some(v => !v.marks.length) ? " (passage justificatif non repéré dans certaines)" : ", passage justificatif surligné"} :</div><div id="obs">` +
      e.evidence.map(v => obsHtml(v, esc)).join("") + `</div>` : "");
  document.querySelector("#obs mark")?.scrollIntoView({block: "nearest"});
}

// overview strip with a draggable window
function drawOverview() {
  const svg = document.getElementById("ov");
  svg.replaceChildren();
  const W = svg.clientWidth || 800, H = 54, L = 12, R = 12, innerW = W - L - R;
  const x = (ms) => L + (ms - DOM_MIN) / (DOM_MAX - DOM_MIN) * innerW;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  for (const [v, lab, major] of ticks(DOM_MIN, DOM_MAX)) {
    if (!major) continue;
    el("line", {x1: x(v), x2: x(v), y1: 4, y2: H - 14, stroke: "var(--line)"}, svg);
    el("text", {x: x(v) + 2, y: H - 3, class: "mute", "font-size": 10}, svg, lab);
  }
  const vis = EVENTS.filter(e => !hidden.has(e.kind));
  const n = Math.max(1, new Set(vis.map(e => e.track)).size), tracks = [...new Set(vis.map(e => e.track))];
  for (const e of vis) {
    const r = tracks.indexOf(e.track), yy = 6 + r * (H - 24) / n;
    el("rect", {x: x(e.a), y: yy, width: Math.max(2, x(e.b) - x(e.a)), height: Math.max(1.5, (H - 24) / n - 1), fill: color(e.kind), opacity: .7}, svg);
  }
  const win = el("rect", {x: x(view[0]), y: 1, width: Math.max(10, x(view[1]) - x(view[0])), height: H - 14, rx: 5, fill: "rgba(80,120,220,.16)", stroke: "#4f7be0", "stroke-width": 1.5, style: "cursor:grab"}, svg);
  const hl = el("rect", {x: x(view[0]) - 5, y: 1, width: 10, height: H - 14, fill: "#4f7be0", opacity: .01, style: "cursor:ew-resize"}, svg);
  const hr = el("rect", {x: x(view[1]) - 5, y: 1, width: 10, height: H - 14, fill: "#4f7be0", opacity: .01, style: "cursor:ew-resize"}, svg);
  const inv = (px) => DOM_MIN + (px - L) / innerW * (DOM_MAX - DOM_MIN);
  const MINSPAN = 120 * DAY;
  const drag = (node, kind) => node.addEventListener("pointerdown", (ev) => {
    ev.preventDefault(); node.setPointerCapture(ev.pointerId);
    const x0 = ev.clientX, v0 = [...view], per = (DOM_MAX - DOM_MIN) / innerW;
    const move = (m) => {
      const d = (m.clientX - x0) * per;
      let [a, b] = v0;
      if (kind === "move") { const span = b - a; a = Math.min(Math.max(DOM_MIN, a + d), DOM_MAX - span); b = a + span; }
      else if (kind === "l") a = Math.min(Math.max(DOM_MIN, a + d), b - MINSPAN);
      else b = Math.max(Math.min(DOM_MAX, b + d), a + MINSPAN);
      view = [a, b]; drawOverview(); drawMain();
    };
    const up = () => { node.removeEventListener("pointermove", move); node.removeEventListener("pointerup", up); };
    node.addEventListener("pointermove", move); node.addEventListener("pointerup", up);
  });
  drag(win, "move"); drag(hl, "l"); drag(hr, "r");
}

function setView(a, b) { view = [Math.max(DOM_MIN, a), Math.min(DOM_MAX, b)]; redraw(); }
function redraw() { drawOverview(); drawMain(); }

// controls
const kindsBar = document.getElementById("kinds");
for (const k of D.kinds) {
  const b = document.createElement("button"); b.className = "chip"; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<i style="background:${k[dark() ? "dark" : "light"]}"></i>${k.label}`;
  b.onclick = () => { hidden.has(k.id) ? hidden.delete(k.id) : hidden.add(k.id); b.setAttribute("aria-pressed", String(!hidden.has(k.id))); redraw(); };
  kindsBar.appendChild(b);
}
const presets = document.getElementById("presets");
const addPreset = (label, fn) => { const b = document.createElement("button"); b.textContent = label; b.onclick = fn; presets.appendChild(b); };
addPreset("Tout", () => setView(DOM_MIN, DOM_MAX));
for (const yrs of [10, 5, 2]) addPreset(`${yrs} dernières années`, () => setView(REF - yrs * 365.25 * DAY, DOM_MAX));
addPreset("−", () => { const c = (view[0] + view[1]) / 2, h = (view[1] - view[0]); setView(c - h, c + h); });
addPreset("+", () => { const c = (view[0] + view[1]) / 2, h = (view[1] - view[0]) / 4; setView(c - h, c + h); });
document.getElementById("legend").innerHTML =
  `<span><span class="sw" style="background:#888;opacity:.55"></span>usage</span><span><span class="sw" style="background:#888;opacity:.85"></span>intoxication</span>` +
  `<span><span class="sw" style="background:#888"></span>rechute</span><span><span class="sw" style="background:#888;opacity:.45;border:1px dashed #888"></span>date approximative ou d'après l'âge</span>` +
  `<span style="color:#e11d48">⚡ perte de contrôle</span><span>◆ événement sans durée</span><span>▶ en cours</span>`;
document.getElementById("main").addEventListener("wheel", (ev) => {
  if (!ev.ctrlKey && !ev.shiftKey) return;
  ev.preventDefault();
  const r = ev.currentTarget.getBoundingClientRect(), W = r.width, f = (ev.clientX - r.left - LABEL_W) / (W - LABEL_W - PADR);
  const c = view[0] + Math.min(Math.max(f, 0), 1) * (view[1] - view[0]), k = ev.deltaY > 0 ? 1.25 : .8;
  setView(c - (c - view[0]) * k, c + (view[1] - c) * k);
}, {passive: false});
addEventListener("resize", redraw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
if (innerWidth < 600) view = [Math.max(DOM_MIN, REF - 5 * 365.25 * DAY), DOM_MAX];
redraw();
</script>
</body>
</html>
