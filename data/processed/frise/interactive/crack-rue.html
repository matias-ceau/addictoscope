nt en foyer à 12 ans (violences intrafamiliales, abus sexuels dans l'enfance). Relation de plusieurs années avec un homme violent (son ex-compagnon [identité]), séparée depuis 2022 mais le croise régulièrement.\nSubstances :\n- crack fumé depuis 6 ans environ, 1 a 2 g/j quand elle a de l'argent (manche, dépannages), perte de contrôle franche\n- alcool : 6 bières fortes de 50 cL par jour, tremblements le matin\n- cannabis occasionnel, tabac 20 cig/j\nClinique : contact méfiant au début puis adhésion. Hypervigilance, sursauts, cauchemars quasi quotidiens, reviviscences, évitement des hommes. Thymie triste. Pas d'idées suicidaires ce jour.\nTableau compatible avec un TSPT complexe, consommations à visée en partie auto-thérapeutique (\"le caillou ça coupe les images\").\nConclusions :\n- RDV toutes les 2 semaines, couplés au passage CAARUD\n- Dépistages à faire avec l'IDE\n- Lien ASS pour hébergement"}, "historique:o3": {"label": "historique · Observation infirmière", "date": "2023-10-03", "text": "TROD VIH et VHC négatifs. Sérologie VHB : non immunisée, 1ère injection de vaccin faite ce jour.\nBrûlures superficielles des doigts et des lèvres, soins faits. Toux grasse depuis 3 semaines, pas de fièvre : à surveiller."}, "historique:o4": {"label": "historique · Entretien social", "date": "2023-10-25", "text": "Mme [identité] [identité], née le [identité]. Domiciliation administrative à l'association, [identité], 33000 BORDEAUX. Tél : [identité] (change souvent de téléphone).\nDroits : RSA à rouvrir (suspendu), demande de CSS. Demande SIAO faite ce jour, appels au 115 la plupart des soirs sans succès.\nSon fils [identité] (9 ans) vit chez sa grand-mère paternelle depuis 2021, visites médiatisées prévues par le juge des enfants mais non réalisées depuis un an."}, "historique:o5": {"label": "historique · Observation psychiatrique de suivi", "date": "2023-11-21", "text": "Observations :\nVue ce jour, accompagnée par l'éducateur.\nAgression sexuelle la semaine dernière la nuit, sous un pont, par un inconnu. Plainte déposée le lendemain avec M. [identité]. Examen aux UMJ fait.\nMajoration nette des reviviscences et des cauchemars, ne dort plus que par fragments, consomme \"pour tenir éveillée\".\nPas d'idées suicidaires, demande de l'aide pour dormir.\nConclusions :\n- Prazosine 1 mg le soir, paliers de 1 mg par semaine jusqu'à 3 mg (surveillance TA)\n- Hydroxyzine 25 mg si besoin, max 2/j\n- RDV dans 1 semaine"}, "historique:o6": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-01-16", "text": "Observations :\nVue ce jour\nMise à l'abri hivernale depuis le 08/01 (gymnase, places 115). Dort mieux.\nPrazosine 3 mg : cauchemars 2 a 3 fois par semaine contre toutes les nuits auparavant. TA correcte, pas de malaise.\nCrack diminué, \"un jour sur deux\". Bières 4 a 5/j.\nConclusions :\nRO prazosine 3 mg + hydroxyzine\nRDV 2 semaines"}, "historique:o7": {"label": "historique · Entretien éducatif", "date": "2024-02-13", "text": "[identité] vient nous apprendre le décès de [identité] le 10/02, retrouvé mort d'une overdose dans un squat. Sidérée, alterne pleurs et rires, \"je suis libre et je suis triste\".\nConsomme beaucoup depuis 3 jours. On reste avec elle une bonne partie de l'après-midi. RDV médical avancé."}, "historique:o8": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-02-20", "text": "Observations :\nVue ce jour, RDV avancé.\nDécès de son ex-compagnon (OD) il y a 10 jours : vécu ambivalent, soulagement et culpabilité (\"j'aurais du être là\"). Majoration des consommations, crack jusqu'à 3 g/j, alcool en hausse.\nIdées de mort passives, pas de scénario, pas d'intention, pense à son fils comme facteur protecteur.\nHospitalisation proposée (unité d'addictologie / psychiatrie) : refus.\nConclusions :\nRDV dans une semaine, appel téléphonique entre les deux par l'éducateur\nNaloxone remise (consomme parfois avec des usagers d'opioïdes)"}, "historique:o9": {"label": "historique · Observation infirmière", "date": "2024-04-09", "text": "Retour d'hospitalisation : hospitalisée du 28/03 au 04/04 en médecine pour pneumopathie (fièvre, toux, crachats noirs). Sevrage alcool sous diazépam pendant le séjour, sans complication.\nSortie avec antibiotiques, terminés. Va mieux. Dit avoir \"pas touché au caillou\" depuis la sortie."}, "historique:o10": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-04-23", "text": "Observations :\nVue ce jour\nAprès l'hospitalisation, crack réduit à 2 a 3 fois par semaine. Bières 3/j.\nPlus de motivation qu'auparavant, \"j'ai vu que mon corps lachait\". Souhaite un hébergement stable \"pour avoir une chance de revoir [identité]\".\nCauchemars stables sous prazosine.\nConclusions :\nSoutien de la candidature en CHRS (courrier)\nRO prazosine 3 mg"}, "historique:o11": {"label": "historique · Entretien social", "date": "2024-06-11", "text": "Entrée en CHRS le 03/06/2024, chambre individuelle. Référente sur place identifiée. RSA rétabli, CSS accordée.\nDemande de reprise des visites médiatisées avec son fils transmise au service de l'ASE.\nNouveau numéro : [identité]."}, "historique:o12": {"label": "historique · Entretien éducatif", "date": "2024-07-02", "text": "Visite au CHRS. [identité] est installée depuis le 10/06, a décoré sa chambre. Elle a revu [identité] le 28/06 en visite médiatisée, une heure, \"il m'a reconnue tout de suite\". Très émue.\nCrack : \"une fois par semaine, le samedi\". Elle s'organise pour ne pas avoir d'argent sur elle le samedi."}, "historique:o13": {"label": "historique · Observation psychiatrique de suivi", "date": "2024-09-17", "text": "Observations :\nVue ce jour\nCrack 1 fois par semaine environ. Dit ne plus boire de bières fortes depuis l'entrée au CHRS.\nPersistance des reviviscences diurnes, évitement, hypervigilance dans les transports. Humeur triste en fond.\nOrientation vers le centre de psychotraumatologie pour EMDR (liste d'attente 2-3 mois).\nConclusions :\n- Introduction sertraline 50 mg\n- Prazosine 3 mg poursuivie\n- RDV 1 mois"}, "historique:o14": {"label": "historique · Observation infirmière", "date": "2024-10-08", "text": "Appel de l'éducatrice du CHRS : Mme [identité] boit 2-3 bières le soir dans sa chambre \"en cachette\". Pas d'alcoolisation massive, pas de violence. À reprendre avec elle et le Dr [identité]."}, "historique:o15": {"label": "historique · Observation psychiatrique de suivi", "date": "2025-01-14", "text": "Observations :\nVue ce jour\nEMDR commencé en décembre au centre de psychotraumatologie, 3 séances, \"c'est dur mais ça bouge\".\nMoins de cauchemars, plus de reviviscences dans la journée. Dernier crack le 24/12 (soirée seule, \"Noël c'est le pire\"). Reconnait les bières au CHRS, 1 a 2 le soir.\nConclusions :\nSertraline 100 mg\nRO prazosine 3 mg\nRDV 6 semaines"}, "historique:o16": {"label": "historique · Observation psychiatrique de suivi", "date": "2025-03-25", "text": "Observations :\nVue ce jour\nRechute de crack 3 jours de suite début mars après la convocation au tribunal pour le procès de son agresseur. Arret de elle-meme ensuite, en a parlé à son éducatrice.\nProcès renvoyé. Anxiété ++. Pas d'idées suicidaires.\nConclusions :\nHydroxyzine si besoin reprise\nEMDR poursuivi\nRDV 1 mois"}, "historique:o17": {"label": "historique · Entretien social", "date": "2025-06-03", "text": "Accès à une résidence sociale le 26/05/2025 (studio, bail d'un an renouvelable). Fin de la prise en charge CHRS.\nLe juge des enfants a élargi les droits : visites avec [identité] sans médiatisation un samedi sur deux à partir de juin."}, "historique:o18": {"label": "historique · Observation psychiatrique de suivi", "date": "2025-07-01", "text": "Observations :\nVue ce jour, dans son nouveau logement depuis fin mai, fière.\nPas de crack depuis mars. Alcool : 1 a 2 bières le week-end. Tabac 15 cig/j.\nCauchemars rares, reviviscences moins intenses. Thymie neutre, projets (formation cuisine).\nConclusions :\nPoursuite sertraline 100 mg, prazosine 3 mg\nRDV 2 mois"}}, "ref": "2025-08-01", "kinds": [{"id": "life_event", "label": "Événements de vie", "light": "#b45309", "dark": "#f59e0b"}, {"id": "substance_use", "label": "Consommations", "light": "#c62828", "dark": "#ef6b6b"}, {"id": "psychiatric", "label": "Psychopathologie", "light": "#6a4bb0", "dark": "#a78bfa"}, {"id": "somatic", "label": "Somatique", "light": "#0f7b6c", "dark": "#34d3b9"}, {"id": "medication", "label": "Médicaments", "light": "#1d5fb4", "dark": "#6aa6f0"}, {"id": "therapeutic_psycho", "label": "Prises en charge", "light": "#4d7c0f", "dark": "#a3d95b"}], "modeLabel": {"usage": "usage", "intoxication": "intoxication", "sevrage": "sevrage", "rechute": "rechute", "craving": "craving"}, "certaintyLabel": {"exact": "date exacte", "month": "mois", "year": "année", "approx": "date approximative"}};

  return n;
};
const fmt = (s) => { if (!s) return ""; const [y,m,d] = s.split("-"); return d ? `${d}/${m}/${y}` : m ? `${m}/${y}` : y; };
const yr = (ms) => new Date(ms).getUTCFullYear();

function ticks(a, b) {
  const span = (b - a) / (365.25*DAY), out = [];
  const step = span > 40 ? 10 : span > 18 ? 5 : span > 9 ? 2 : span > 3.5 ? 1 : 0;
  if (step) { for (let y = Math.ceil(yr(a)/step)*step; Date.UTC(y,0,1) <= b; y += step) out.push([Date.UTC(y,0,1), String(y), true]); }
  else {
    const q = span > 1.6 ? 3 : 1;
    for (let y = yr(a); y <= yr(b); y++) for (let m = 0; m < 12; m += q) {
      const v = Date.UTC(y, m, 1); if (v < a || v > b) continue;
      out.push([v, m === 0 ? String(y) : `${String(m+1).padStart(2,"0")}/${String(y).slice(2)}`, m === 0]);
    }
  }
  return out;
}

const bolt = (x, y, s=7) => `M${x} ${y-s} L${x-s*.55} ${y+.1} L${x-.05*s} ${y+.1} L${x-s*.35} ${y+s} L${x+s*.6} ${y-.25*s} L${x+.05*s} ${y-.25*s} Z`;

function drawMain() {
  const svg = document.getElementById("main");
  svg.replaceChildren();
  const W = svg.clientWidth || 800;
  LABEL_W = W < 600 ? 92 : 150;
  const innerW = W - LABEL_W - PADR;
  const x = (ms) => LABEL_W + (ms - view[0]) / (view[1] - view[0]) * innerW;
  const kinds = D.kinds.filter(k => !hidden.has(k.id));
  const rows = [];
  for (const k of kinds) if (k.id !== "life_event") {
    rows.push({head: k});
    for (const tr of D.tracks.filter(tr => tr.kind === k.id)) rows.push({track: tr});
  }
  const showLife = !hidden.has("life_event");
  const H = AXIS + 18 + rows.length * ROW + 24;
  svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const defs = el("defs", {}, svg);
  const cp = el("clipPath", {id: "clip"}, defs); el("rect", {x: LABEL_W, y: 0, width: innerW, height: H}, cp);
  // grid + axis
  const gridG = el("g", {}, svg);
  for (const [v, lab, major] of ticks(...view)) {
    const xx = x(v);
    el("line", {x1: xx, x2: xx, y1: AXIS - 4, y2: H - 20, stroke: "var(--line)", "stroke-width": major ? 1 : .5}, gridG);
    el("text", {x: xx + 3, y: H - 7, class: "mute"}, gridG, lab);
  }
  el("line", {x1: LABEL_W, x2: W - PADR, y1: AXIS - 4, y2: AXIS - 4, stroke: "var(--axis)", "stroke-width": 4, "stroke-linecap": "round"}, svg);
  const g = el("g", {"clip-path": "url(#clip)"}, svg);
  // life events on the axis
  if (showLife) {
    const life = EVENTS.filter(e => e.kind === "life_event" && e.b >= view[0] && e.a <= view[1]);
    const lanes = [[], [], [], [], []];
    for (const e of life.sort((p, q) => p.a - q.a)) {
      const pt = e.point || (e.b - e.a) < 120*DAY;
      const xa = x(Math.max(e.a, view[0])), xb = pt ? xa : x(Math.min(e.b, view[1]));
      const w = e.label.length * 5.9 + 10, flip = xa + w > W - PADR;
      const iv = flip ? [xa - w, xa + 4] : [xa - 4, xa + w];
      let ln = lanes.findIndex(l => l.every(o => o[1] < iv[0] || o[0] > iv[1]));
      if (ln < 0) ln = lanes.length - 1;
      lanes[ln].push(iv);
      const ty = AXIS - 14 - ln * 13 - 4;
      const grp = el("g", {class: "ev", "data-i": e.i}, g);
      if (!pt) el("rect", {x: xa, y: AXIS - 8, width: Math.max(2, xb - xa), height: 8, rx: 3, fill: color("life_event"), opacity: .85}, grp);
      else el("path", {d: `M${xa} ${AXIS-11} l6 6 l-6 6 l-6 -6 Z`, fill: color("life_event")}, grp);
      el("line", {x1: xa, x2: xa, y1: ty + 3, y2: AXIS - 11, stroke: color("life_event"), "stroke-width": 1, opacity: .6}, grp);
      el("text", {x: flip ? xa - 3 : xa + 3, y: ty, "font-size": 11, "text-anchor": flip ? "end" : "start", "pointer-events": "none"}, grp, e.label);
      if (e.loss) el("path", {d: bolt(xa, AXIS + 6, 6), fill: "#e11d48"}, grp);
    }
  }
  // rows
  let y = AXIS + 6;
  for (const r of rows) {
    if (r.head) {
      el("text", {x: 6, y: y + 17, "font-weight": 600, fill: color(r.head.id)}, svg, r.head.label.toUpperCase()).setAttribute("font-size", 11);
      el("line", {x1: 6, x2: W - PADR, y1: y + ROW - 3, y2: y + ROW - 3, stroke: color(r.head.id), opacity: .35}, svg);
    } else {
      const cut = W < 600 ? 13 : 24;
      const lab = r.track.label.length > cut ? r.track.label.slice(0, cut - 1) + "…" : r.track.label;
      el("text", {x: 12, y: y + 17, class: "mute"}, svg, lab).appendChild(Object.assign(document.createElementNS(NS, "title"), {textContent: r.track.label}));
      for (const e of EVENTS.filter(e => e.track === r.track.id)) {
        if (e.b < view[0] || e.a > view[1]) continue;
        const grp = el("g", {class: "ev", "data-i": e.i}, g);
        const c = color(e.kind), op = e.mode ? (MODE_OP[e.mode] ?? .6) : .8;
        const xa = x(e.a), xb = x(e.b);
        const dash = e.certainty === "approx" || e.ageNote ? "4 3" : null;
        if (e.point || xb - xa < 5) {
          const pt = el("path", {d: `M${xa} ${y+5} l7 7 l-7 7 l-7 -7 Z`, fill: c, opacity: op}, grp);
          if (dash) { pt.setAttribute("stroke", c); pt.setAttribute("stroke-dasharray", "2 2"); pt.setAttribute("fill-opacity", .45); }
        } else {
          const rc = el("rect", {x: xa, y: y + 4, width: xb - xa, height: ROW - 10, rx: 4, fill: c, opacity: op}, grp);
          if (dash) { rc.setAttribute("stroke", c); rc.setAttribute("stroke-dasharray", dash); rc.setAttribute("fill-opacity", .45); }
          if (e.ongoing && xb < W) el("path", {d: `M${xb} ${y+4} l8 ${(ROW-10)/2} l-8 ${(ROW-10)/2} Z`, fill: c, opacity: op}, grp);
        }
        if (e.loss) el("path", {d: bolt(xa, y + ROW/2 - 1), fill: "#e11d48", stroke: "var(--panel)", "stroke-width": .8}, grp);
        if (e.mode && e.mode !== "usage" && xb - xa > 56) el("text", {x: xa + 6, y: y + 17, fill: "#fff", "font-size": 10.5, "pointer-events": "none"}, grp, MODE_LABEL(e.mode)).setAttribute("style", "fill:#fff");
      }
    }
    y += ROW;
  }
  svg.querySelectorAll(".ev").forEach(n => {
    const go = () => select(+n.dataset.i);
    n.addEventListener("click", go); n.addEventListener("pointerenter", (ev) => { if (ev.pointerType === "mouse") go(); });
  });
  if (selected !== null) svg.querySelector(`.ev[data-i="${selected}"]`)?.classList.add("sel");
}
const MODE_LABEL = (m) => D.modeLabel[m] || m;

let selected = null;
function obsHtml(v, esc) {
  const o = D.obs[v.id];
  let html = "", at = 0;
  for (const [a, b] of v.marks) { html += esc(o.text.slice(at, a)) + "<mark>" + esc(o.text.slice(a, b)) + "</mark>"; at = b; }
  html += esc(o.text.slice(at));
  return `<div class="obs"><div class="oh">${o.date ? esc(o.date) + " · " : ""}${esc(o.label)}${o.summary_only ? " · résumé" : ""}</div><div class="ot">${html}</div></div>`;
}
function select(i) {
  selected = i;
  document.querySelectorAll(".ev").forEach(n => n.classList.toggle("sel", +n.dataset.i === i));
  const e = EVENTS[i];
  const when = e.endLabel ? (e.startLabel === e.endLabel ? fmt(e.startLabel) : `${fmt(e.startLabel)} → ${fmt(e.endLabel)}`)
    : e.ongoing ? `depuis ${fmt(e.startLabel)} (en cours)` : fmt(e.startLabel);
  const esc = (s) => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const bits = [];
  if (e.mode) bits.push(MODE_LABEL(e.mode));
  if (e.certainty) bits.push(D.certaintyLabel[e.certainty] || e.certainty);
  if (e.ageNote) bits.push(e.ageNote);
  if (e.loss) bits.push("⚡ perte de contrôle");
  document.getElementById("detail").innerHTML =
    `<b>${esc(e.label)}</b> <span class="k">· ${esc(kindOf[e.kind].label)} · ${when}${bits.length ? " · " + esc(bits.join(" · ")) : ""}</span>` +
    (e.note ? `<div>${esc(e.note)}</div>` : "") +
    (e.sources.length ? `<div class="k">Autres sources : ${e.sources.map(esc).join(" ; ")}</div>` : "") +
    (e.evidence.length ? `<div class="k" style="margin-top:8px">${e.evidence.length > 1 ? "Observations" : "Observation"} d'origine${e.evidence.some(v => !v.marks.length) ? " (passage justificatif non repéré dans certaines)" : ", passage justificatif surligné"} :</div><div id="obs">` +
      e.evidence.map(v => obsHtml(v, esc)).join("") + `</div>` : "");
  document.querySelector("#obs mark")?.scrollIntoView({block: "nearest"});
}

// overview strip with a draggable window
function drawOverview() {
  const svg = document.getElementById("ov");
  svg.replaceChildren();
  const W = svg.clientWidth || 800, H = 54, L = 12, R = 12, innerW = W - L - R;
  const x = (ms) => L + (ms - DOM_MIN) / (DOM_MAX - DOM_MIN) * innerW;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  for (const [v, lab, major] of ticks(DOM_MIN, DOM_MAX)) {
    if (!major) continue;
    el("line", {x1: x(v), x2: x(v), y1: 4, y2: H - 14, stroke: "var(--line)"}, svg);
    el("text", {x: x(v) + 2, y: H - 3, class: "mute", "font-size": 10}, svg, lab);
  }
  const vis = EVENTS.filter(e => !hidden.has(e.kind));
  const n = Math.max(1, new Set(vis.map(e => e.track)).size), tracks = [...new Set(vis.map(e => e.track))];
  for (const e of vis) {
    const r = tracks.indexOf(e.track), yy = 6 + r * (H - 24) / n;
    el("rect", {x: x(e.a), y: yy, width: Math.max(2, x(e.b) - x(e.a)), height: Math.max(1.5, (H - 24) / n - 1), fill: color(e.kind), opacity: .7}, svg);
  }
  const win = el("rect", {x: x(view[0]), y: 1, width: Math.max(10, x(view[1]) - x(view[0])), height: H - 14, rx: 5, fill: "rgba(80,120,220,.16)", stroke: "#4f7be0", "stroke-width": 1.5, style: "cursor:grab"}, svg);
  const hl = el("rect", {x: x(view[0]) - 5, y: 1, width: 10, height: H - 14, fill: "#4f7be0", opacity: .01, style: "cursor:ew-resize"}, svg);
  const hr = el("rect", {x: x(view[1]) - 5, y: 1, width: 10, height: H - 14, fill: "#4f7be0", opacity: .01, style: "cursor:ew-resize"}, svg);
  const inv = (px) => DOM_MIN + (px - L) / innerW * (DOM_MAX - DOM_MIN);
  const MINSPAN = 120 * DAY;
  const drag = (node, kind) => node.addEventListener("pointerdown", (ev) => {
    ev.preventDefault(); node.setPointerCapture(ev.pointerId);
    const x0 = ev.clientX, v0 = [...view], per = (DOM_MAX - DOM_MIN) / innerW;
    const move = (m) => {
      const d = (m.clientX - x0) * per;
      let [a, b] = v0;
      if (kind === "move") { const span = b - a; a = Math.min(Math.max(DOM_MIN, a + d), DOM_MAX - span); b = a + span; }
      else if (kind === "l") a = Math.min(Math.max(DOM_MIN, a + d), b - MINSPAN);
      else b = Math.max(Math.min(DOM_MAX, b + d), a + MINSPAN);
      view = [a, b]; drawOverview(); drawMain();
    };
    const up = () => { node.removeEventListener("pointermove", move); node.removeEventListener("pointerup", up); };
    node.addEventListener("pointermove", move); node.addEventListener("pointerup", up);
  });
  drag(win, "move"); drag(hl, "l"); drag(hr, "r");
}

function setView(a, b) { view = [Math.max(DOM_MIN, a), Math.min(DOM_MAX, b)]; redraw(); }
function redraw() { drawOverview(); drawMain(); }

// controls
const kindsBar = document.getElementById("kinds");
for (const k of D.kinds) {
  const b = document.createElement("button"); b.className = "chip"; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<i style="background:${k[dark() ? "dark" : "light"]}"></i>${k.label}`;
  b.onclick = () => { hidden.has(k.id) ? hidden.delete(k.id) : hidden.add(k.id); b.setAttribute("aria-pressed", String(!hidden.has(k.id))); redraw(); };
  kindsBar.appendChild(b);
}
const presets = document.getElementById("presets");
const addPreset = (label, fn) => { const b = document.createElement("button"); b.textContent = label; b.onclick = fn; presets.appendChild(b); };
addPreset("Tout", () => setView(DOM_MIN, DOM_MAX));
for (const yrs of [10, 5, 2]) addPreset(`${yrs} dernières années`, () => setView(REF - yrs * 365.25 * DAY, DOM_MAX));
addPreset("−", () => { const c = (view[0] + view[1]) / 2, h = (view[1] - view[0]); setView(c - h, c + h); });
addPreset("+", () => { const c = (view[0] + view[1]) / 2, h = (view[1] - view[0]) / 4; setView(c - h, c + h); });
document.getElementById("legend").innerHTML =
  `<span><span class="sw" style="background:#888;opacity:.55"></span>usage</span><span><span class="sw" style="background:#888;opacity:.85"></span>intoxication</span>` +
  `<span><span class="sw" style="background:#888"></span>rechute</span><span><span class="sw" style="background:#888;opacity:.45;border:1px dashed #888"></span>date approximative ou d'après l'âge</span>` +
  `<span style="color:#e11d48">⚡ perte de contrôle</span><span>◆ événement sans durée</span><span>▶ en cours</span>`;
document.getElementById("main").addEventListener("wheel", (ev) => {
  if (!ev.ctrlKey && !ev.shiftKey) return;
  ev.preventDefault();
  const r = ev.currentTarget.getBoundingClientRect(), W = r.width, f = (ev.clientX - r.left - LABEL_W) / (W - LABEL_W - PADR);
  const c = view[0] + Math.min(Math.max(f, 0), 1) * (view[1] - view[0]), k = ev.deltaY > 0 ? 1.25 : .8;
  setView(c - (c - view[0]) * k, c + (view[1] - c) * k);
}, {passive: false});
addEventListener("resize", redraw);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
if (innerWidth < 600) view = [Math.max(DOM_MIN, REF - 5 * 365.25 * DAY), DOM_MAX];
redraw();
</script>
</body>
</html>
