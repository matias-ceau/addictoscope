[project]
name = "addictoscope"
version = "0.1.0"
description = "Pipeline transforming free-text medical notes into structured infographics — starting with a chronological timeline (frise chronologique)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Matias Ceau", email = "matiasceau@gmail.com" }]
dependencies = []

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/addictoscope"]
